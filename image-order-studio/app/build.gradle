plugins { id 'com.android.application' }

android {
    namespace 'com.twobornot.imageorder'
    compileSdk 36
    defaultConfig {
        applicationId 'com.twobornot.imageorder'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
