plugins { id 'com.android.application' }

android {
    namespace 'com.twobornot.imageorder'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.twobornot.imageorder'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.5.5'
        // A/B compatibility trial: keep provider access but optionally omit its browsing root.
        def exposeSaf = providers.gradleProperty('imageOrderExposeSafRoot').orElse('true').get()
        if (!(exposeSaf in ['true', 'false'])) throw new GradleException('imageOrderExposeSafRoot must be true or false')
        buildConfigField 'boolean', 'EXPOSE_SAF_ROOT', exposeSaf
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
