name: RGB Blocks 1.20.1 Forge full port build
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/build_mc1201_forge.py'
      - 'rgb-blocks-compat/package_ecosystem.py'
      - 'rgb-blocks-compat/test_mc1201_forge_server.py'
      - '.github/workflows/rgb-blocks-port-mc1201-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Prepare original RGB 1.3.1 resources and Forge 1.20.1 code
        run: |
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
      - name: Compile and package Forge 1.20.1 mod
        working-directory: port-work/mc1201-forge
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee compile.log
      - name: Validate actual Forge 1.20.1 + Chisels & Bits dedicated server
        if: success()
        continue-on-error: true
        run: python3 rgb-blocks-compat/test_mc1201_forge_server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1201-forge-game-server-test
          path: |
            mc1201-forge-runtime/*.log
            mc1201-forge-runtime/result.json
          retention-days: 30
      - name: Generate standalone Gradle wrapper for fully buildable source
        if: success()
        working-directory: port-work/mc1201-forge
        run: gradle --no-daemon wrapper --gradle-version 8.8
      - name: Build full source archive
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('port-work/mc1201-forge')
          dst=Path('RgbBlocks-1.3.1-MC1.20.1-Forge-port-source.zip')
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for base in ('src','build.gradle','settings.gradle','gradle.properties','gradlew','gradlew.bat','gradle'):
              p=root/base
              for f in (p.rglob('*') if p.is_dir() else [p]):
                if f.is_file():z.write(f,str(f.relative_to(root)))
          print('Source ZIP:',dst.stat().st_size,'bytes')
          PY
      - name: Create complete RGB Blocks + building ecosystem Modrinth launcher profile
        if: success()
        run: python3 rgb-blocks-compat/package_ecosystem.py forge1201
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1201-forge-whole-minecraft-ecosystem-MRPACK
          path: |
            rgb-blocks-compat/packages/*.mrpack
            rgb-blocks-compat/packages/*-lock.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1201-forge-build-logs
          path: port-work/mc1201-forge/compile.log
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rgbblocks-1201-forge-JAR-RUNTIME-UNVERIFIED
          path: port-work/mc1201-forge/build/libs/*.jar
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rgbblocks-1201-forge-full-source
          path: RgbBlocks-1.3.1-MC1.20.1-Forge-port-source.zip
          retention-days: 30
