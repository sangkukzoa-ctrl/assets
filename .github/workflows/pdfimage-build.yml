name: Android APK and AAB Build
on:
  push:
    branches:
      - 'pdfimage-ci/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android Release / Debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore original project sources
        shell: bash
        run: |
          set -euo pipefail
          cat _ci_payload/part{1,2,3,4,5}.txt | base64 -d > /tmp/pdfimage-source.tar.bz2
          echo '528d7714dcd50f27dae26a7cffc7741d78351f1ba55cf62d11131d290d812dca  /tmp/pdfimage-source.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/pdfimage-source.tar.bz2
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Plain Java page-range tests
        run: |
          mkdir -p /tmp/pdf-tests
          javac -d /tmp/pdf-tests app/src/main/java/com/hsiwan/pdfimage/PageSelection.java tests/PageSelectionTest.java
          java -cp /tmp/pdf-tests PageSelectionTest
      - name: Assemble debug APK, release APK and bundle
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Verify outputs
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFImage-v1.2.0-installable-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: PDFImage-v1.2.0-unsigned-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
