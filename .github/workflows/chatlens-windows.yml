name: ChatLens OCR v0.4.0 Windows release
on:
  push:
    branches: [chatlens-v0400-release]
    paths: ['ChatLensOCR/**', '.github/workflows/chatlens-windows.yml']
  workflow_dispatch:
concurrency:
  group: chatlens-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "opencv-python-headless>=4.8" "Pillow>=10" "numpy>=1.26,<3" "pyinstaller>=6.10,<7" "pytesseract>=0.3.13,<1"
      - name: Install Tesseract
        run: choco install tesseract -y --no-progress
      - name: Add Korean OCR data
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/kor.traineddata' -OutFile (Join-Path $env:ProgramFiles 'Tesseract-OCR/tessdata/kor.traineddata')
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata' -OutFile (Join-Path $env:ProgramFiles 'Tesseract-OCR/tessdata/eng.traineddata')
      - name: Download job icons
        run: |
          @'
          import io, zipfile, urllib.request, pathlib
          url="https://github.com/xivapi/classjob-icons/archive/refs/heads/master.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"ChatLensOCR-build"})
          with urllib.request.urlopen(req, timeout=90) as res: z=zipfile.ZipFile(io.BytesIO(res.read()))
          target=pathlib.Path("ChatLensOCR/assets/jobs");target.mkdir(parents=True,exist_ok=True)
          for name in z.namelist():
              if "/icons/" in name and name.endswith(".png"):
                  (target/pathlib.Path(name).name).write_bytes(z.read(name))
          print("icons",len(list(target.glob("*.png"))))
          assert len(list(target.glob("*.png")))>=40
          '@ | python -
      - name: Warm up three OCR languages
        run: |
          @'
          import sys, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          sys.path.insert(0,"ChatLensOCR")
          from app import recognize
          img=Image.new("RGB",(1000,220),"white")
          font=ImageFont.truetype("C:/Windows/Fonts/arial.ttf",60)
          ImageDraw.Draw(img).text((20,60),"CHATLENS OCR 12345",fill="black",font=font)
          for lang in ["한국어","영어","일본어"]:
              found=recognize(img,lang,False)
              print("model loaded",repr(lang),len(found),flush=True)
              assert found, "OCR failed"
          import rapidocr
          source=Path(rapidocr.__file__).parent/"models"
          target=Path("ChatLensOCR/models")
          shutil.copytree(source,target,dirs_exist_ok=True)
          files=list(target.rglob("*.onnx"))
          print("ONNX models",len(files),[p.name for p in files],flush=True)
          assert len(files)>=4
          '@ | python -
      - name: Run three-mode synthetic screenshot OCR tests
        run: python ChatLensOCR/test_layout_v2.py
      - name: Test resize exception guard and debug log with product screenshots
        run: python ChatLensOCR/test_resize_debug_v0372.py
      - name: Validate versioned TXT test-result export
        run: python ChatLensOCR/test_export_v0373_regression.py
      - name: Validate multi-column shopping-card segmentation
        run: python ChatLensOCR/test_shop_grid_v0374.py
      - name: Build single Windows GUI executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ChatLensOCR_v0.4.0 --collect-all rapidocr --collect-all onnxruntime --collect-all cv2 --hidden-import=pytesseract --hidden-import=explorer_v1 --hidden-import=colored_page --hidden-import=pvp_v2 --hidden-import=kakao_stickers --hidden-import=kakao_korean --hidden-import=sticker_match_v035 --hidden-import=kakao_names_v036 --hidden-import=ffxiv_combat_v037 --hidden-import=ffxiv_scoreboard_v037 --hidden-import=multicolumn_v037 --hidden-import=shop_grid_v0374 --hidden-import=ocr_guard_v0372 --hidden-import=debuglog_v0372 --hidden-import=batch_v0372 --hidden-import=test_export_v0373 --add-data "$env:ProgramFiles\Tesseract-OCR;tesseract" --add-data "ChatLensOCR/assets;assets" --add-data "ChatLensOCR/models;models" --hidden-import=rapidocr --hidden-import=onnxruntime ChatLensOCR/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Verify frozen executable with network blocked
        run: |
          $p = Start-Process -FilePath (Resolve-Path ".\dist\ChatLensOCR_v0.4.0.exe") -ArgumentList "--self-test", (Join-Path $PWD "selftest.json") -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json }
          if ($p.ExitCode -ne 0) { throw "OCR frozen selftest failed: $($p.ExitCode)" }
          Get-Content selftest.json
      - name: Authenticode-sign EXE if a trusted certificate is configured
        id: codesign
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CHATLENS_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CHATLENS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGN_PFX_BASE64 -or -not $env:CODE_SIGN_PFX_PASSWORD) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "No trusted certificate configured: release will be explicitly unsigned prerelease."
            exit 0
          }
          $cert = Join-Path $env:RUNNER_TEMP 'chatlens_signing.pfx'
          $exe = (Resolve-Path 'dist/ChatLensOCR_v0.4.0.exe').Path
          try {
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw 'Windows SDK SignTool is missing' }
            & $signtool sign /f $cert /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            & $signtool verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verify failed' }
            "signed=true" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $cert -Force -ErrorAction SilentlyContinue
          }
      - name: Create and validate release archive
        run: |
          $exe = (Resolve-Path "dist/ChatLensOCR_v0.4.0.exe").Path
          $zip = "dist/ChatLensOCR_v0.4.0_Windows_x64.zip"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item $exe).Length -lt 25MB) { throw "Executable unexpectedly small" }
          Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal -Force
          $check = Join-Path $env:RUNNER_TEMP "ChatLensVerify"
          New-Item -ItemType Directory -Force -Path $check | Out-Null
          Expand-Archive -Path $zip -DestinationPath $check -Force
          $extracted = (Get-FileHash (Join-Path $check "ChatLensOCR_v0.4.0.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $extracted) { throw "Archive checksum mismatch" }
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$sha  ChatLensOCR_v0.4.0.exe"
            "$zipSha  ChatLensOCR_v0.4.0_Windows_x64.zip"
          ) | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"
          Write-Host "EXE bytes: $((Get-Item $exe).Length)"
          Write-Host "ZIP bytes: $((Get-Item $zip).Length)"
          Write-Host "ZIP extract checksum verified"
      - name: Attest binary build provenance (different from Authenticode)
        uses: actions/attest@v4
        with:
          subject-path: dist/ChatLensOCR_v0.4.0.exe
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_SIGNED: ${{ steps.codesign.outputs.signed }}
        run: |
          $tag="chatlens-v0.4.0"
          $assets=@("dist/ChatLensOCR_v0.4.0.exe","dist/ChatLensOCR_v0.4.0_Windows_x64.zip","dist/SHA256SUMS.txt","selftest.json")
          $notes = Get-Content 'CHATLENS_RELEASE_NOTES.md' -Raw -Encoding utf8
          if ($env:CODE_SIGNED -ne 'true') {
            $notes = "UNSIGNED PREVIEW: Windows may show an unknown publisher warning. This EXE has no Authenticode signature." + [Environment]::NewLine + $notes
          }
          $notes | Set-Content 'release-notes-generated.md' -Encoding utf8
          $hasRelease = $false
          try {
            $oldPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & gh release view $tag --json tagName 2>$null | Out-Null
            $hasRelease = ($LASTEXITCODE -eq 0)
          } finally { $ErrorActionPreference = $oldPreference }
          if ($hasRelease) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
            if ($env:CODE_SIGNED -eq 'true') {
              gh release edit $tag --title "ChatLens OCR v0.4.0 Windows x64" --notes-file 'release-notes-generated.md' --prerelease=false
            } else {
              gh release edit $tag --title "ChatLens OCR v0.4.0 Windows x64 (unsigned preview)" --notes-file 'release-notes-generated.md' --prerelease
            }
          } else {
            if ($env:CODE_SIGNED -eq 'true') {
              gh release create $tag $assets --title "ChatLens OCR v0.4.0 Windows x64" --target "$env:GITHUB_SHA" --notes-file 'release-notes-generated.md'
            } else {
              gh release create $tag $assets --title "ChatLens OCR v0.4.0 Windows x64 (unsigned preview)" --target "$env:GITHUB_SHA" --notes-file 'release-notes-generated.md' --prerelease
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          $verify=Join-Path $env:RUNNER_TEMP "release_download"
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $tag --pattern "ChatLensOCR_v0.4.0.exe" --dir $verify
          if ($LASTEXITCODE -ne 0) { throw "Release EXE redownload failed" }
          $got = (Get-FileHash (Join-Path $verify "ChatLensOCR_v0.4.0.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $want = (Get-FileHash "dist/ChatLensOCR_v0.4.0.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "GitHub release asset digest mismatch" }
          Write-Host "Release round-trip SHA256 verified: $got"
      - name: Write verifiable build outcome to release branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          SIGNED: ${{ steps.codesign.outputs.signed }}
        run: |
          $record = @{
            app = "ChatLens OCR"
            version = "0.4.0"
            build_status = $env:STATUS
            authenticode_signed = ($env:SIGNED -eq "true")
            source_sha = $env:GITHUB_SHA
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            release_page = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/chatlens-v0.4.0"
            recorded_utc = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json -Compress
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($record + [Environment]::NewLine))
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/CHATLENS_BUILD_STATUS.json"
          $previous = gh api $apiPath 2>$null
          $existingSha = ""
          if ($LASTEXITCODE -eq 0) { $existingSha = ($previous | ConvertFrom-Json).sha }
          $request = @{
            message = "chore(ChatLens): record v0.4.0 GitHub Actions build outcome"
            content = $encoded
            branch = $env:GITHUB_REF_NAME
          }
          if ($existingSha) { $request.sha = $existingSha }
          $inputFile = Join-Path $env:RUNNER_TEMP "chatlens-status-request.json"
          ($request | ConvertTo-Json -Compress) | Set-Content -LiteralPath $inputFile -Encoding utf8
          gh api --method PUT $apiPath --input $inputFile
          if ($LASTEXITCODE -ne 0) { Write-Warning "Could not persist build outcome marker." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatLensOCR-v0.4.0-Windows-x64
          path: |
            dist/ChatLensOCR_v0.4.0.exe
            dist/ChatLensOCR_v0.4.0_Windows_x64.zip
            dist/SHA256SUMS.txt
            selftest.json
          if-no-files-found: warn
