name: Image Order - Android development CI
on:
  push:
    branches: ['image-order-studio/dev', 'image-order/dev-v2']
    paths:
      - 'image-order-studio/app/**'
      - 'image-order-studio/externalcaller/**'
      - 'image-order-studio/tests/**'
      - 'image-order-studio/*.gradle'
      - 'image-order-studio/gradle.properties'
      - '.github/workflows/image-order-ci.yml'
  workflow_dispatch:
# Only the newest source commit should consume emulator or release-build runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: image-order-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK API 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check source and order invariants
        run: |
          python3 tests/release_source_checks.py
          bash -n tests/run-cross-app-qa.sh
          bash -n tests/gradle-with-retry.sh
          bash tests/gradle-retry-test.sh
          mkdir -p build/testclasses
          javac -d build/testclasses app/src/main/java/com/twobornot/imageorder/SequenceLedger.java tests/SequenceLedgerTest.java
          java -cp build/testclasses SequenceLedgerTest
          javac -d build/testclasses app/src/main/java/com/twobornot/imageorder/PickerDecision.java tests/PickerDecisionTest.java
          java -cp build/testclasses com.twobornot.imageorder.PickerDecisionTest
          javac -d build/testclasses app/src/main/java/com/twobornot/imageorder/ImageMimePolicy.java tests/ImageMimePolicyTest.java
          java -cp build/testclasses com.twobornot.imageorder.ImageMimePolicyTest
          javac -d build/testclasses app/src/main/java/com/twobornot/imageorder/MediaNaming.java tests/MediaNamingTest.java
          java -cp build/testclasses com.twobornot.imageorder.MediaNamingTest
          javac -d build/testclasses app/src/main/java/com/twobornot/imageorder/OriginalDelivery.java app/src/main/java/com/twobornot/imageorder/SequenceLedger.java tests/OriginalDeliveryTest.java
          java -cp build/testclasses com.twobornot.imageorder.OriginalDeliveryTest
          javac -d build/testclasses app/src/main/java/com/twobornot/imageorder/SafDocumentIds.java tests/SafDocumentIdsTest.java
          java -cp build/testclasses com.twobornot.imageorder.SafDocumentIdsTest
      - name: Compile unsigned Android release APK
        run: bash tests/gradle-with-retry.sh compile --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleAndroidTest :externalcaller:assembleDebug :externalcaller:assembleAndroidTest
      - name: Validate APK metadata and debug signature
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s externalcaller/build/outputs/apk/debug/externalcaller-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 26 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep -E "package: name='com.twobornot.imageorder' versionCode='11' versionName='0.5.5'"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Package complete v0.5.5 development source (tracked files only)
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=ImageOrder-v0.5.5-development-source.zip HEAD \
            image-order-studio \
            .github/workflows/image-order-ci.yml \
            .github/workflows/image-order-cross-app-qa.yml \
            .github/workflows/image-order-beta-release.yml
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('ImageOrder-v0.5.5-development-source.zip') as z:
              names=z.namelist()
              assert z.testzip() is None
              assert 'image-order-studio/app/src/main/java/com/twobornot/imageorder/NativeGalleryActivity.java' in names
              assert 'image-order-studio/externalcaller/src/androidTest/java/com/twobornot/imageorder/caller/WebUploadCallerTest.java' in names
              assert 'image-order-studio/PROJECT_GOAL_KO.md' in names
              assert not any(name.endswith(('.p12','.jks','.keystore','.key')) for name in names)
          PY
          sha256sum ImageOrder-v0.5.5-development-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImageOrder-v0.5.5-complete-source
          path: ImageOrder-v0.5.5-development-source.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ImageOrder-v0.5.5-ci-only
          path: |
            image-order-studio/app/build/outputs/apk/debug/app-debug.apk
            image-order-studio/externalcaller/build/outputs/apk/debug/externalcaller-debug.apk
            image-order-studio/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
          if-no-files-found: error
