name: ChatLens OCR v0.5.0-rc.2 Windows candidate QA
on:
  push:
    branches: [chatlens-v050-candidate]
    paths: ['ChatLensOCR/**', '.github/workflows/chatlens-v050-candidate.yml']
concurrency:
  group: chatlens-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "opencv-python-headless>=4.8" "Pillow>=10" "numpy>=1.26,<3" "pyinstaller>=6.10,<7" "pytesseract>=0.3.13,<1"
      - name: Install Tesseract
        run: choco install tesseract -y --no-progress
      - name: Add Korean OCR data
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/kor.traineddata' -OutFile (Join-Path $env:ProgramFiles 'Tesseract-OCR/tessdata/kor.traineddata')
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata' -OutFile (Join-Path $env:ProgramFiles 'Tesseract-OCR/tessdata/eng.traineddata')
      - name: Download job icons
        run: |
          @'
          import io, zipfile, urllib.request, pathlib
          url="https://github.com/xivapi/classjob-icons/archive/refs/heads/master.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"ChatLensOCR-build"})
          with urllib.request.urlopen(req, timeout=90) as res: z=zipfile.ZipFile(io.BytesIO(res.read()))
          target=pathlib.Path("ChatLensOCR/assets/jobs");target.mkdir(parents=True,exist_ok=True)
          for name in z.namelist():
              if "/icons/" in name and name.endswith(".png"):
                  (target/pathlib.Path(name).name).write_bytes(z.read(name))
          print("icons",len(list(target.glob("*.png"))))
          assert len(list(target.glob("*.png")))>=40
          '@ | python -
      - name: Warm up three OCR languages
        run: |
          @'
          import sys, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          sys.path.insert(0,"ChatLensOCR")
          from app import recognize
          img=Image.new("RGB",(1000,220),"white")
          font=ImageFont.truetype("C:/Windows/Fonts/arial.ttf",60)
          ImageDraw.Draw(img).text((20,60),"CHATLENS OCR 12345",fill="black",font=font)
          for lang in ["한국어","영어","일본어"]:
              found=recognize(img,lang,False)
              print("model loaded",repr(lang),len(found),flush=True)
              assert found, "OCR failed"
          import rapidocr
          source=Path(rapidocr.__file__).parent/"models"
          target=Path("ChatLensOCR/models")
          shutil.copytree(source,target,dirs_exist_ok=True)
          files=list(target.rglob("*.onnx"))
          print("ONNX models",len(files),[p.name for p in files],flush=True)
          assert len(files)>=4
          '@ | python -
      - name: Run three-mode synthetic screenshot OCR tests
        run: python ChatLensOCR/test_layout_v2.py
      - name: Test resize exception guard and debug log with product screenshots
        run: python ChatLensOCR/test_resize_debug_v0372.py
      - name: Validate versioned TXT test-result export
        run: python ChatLensOCR/test_export_v0373_regression.py
      - name: Validate multi-column shopping-card segmentation
        run: python ChatLensOCR/test_shop_grid_v0374.py
      - name: Round 1 regression (Kakao nickname and micro-bubbles)
        run: python ChatLensOCR/test_ocr_round1.py
      - name: Round 2 regression (multiline fidelity)
        run: python ChatLensOCR/test_ocr_round2.py
      - name: Round 3 regression (FFXIV mixed Latin)
        run: python ChatLensOCR/test_ocr_round3.py
      - name: Round 3 regression (Explorer metadata cells)
        run: python ChatLensOCR/test_explorer_cells_v0422.py
      - name: Round 4 regression (general UI and image input)
        run: python ChatLensOCR/test_ocr_round4.py
      - name: Round 5 fidelity, short syllable and punctuation regression
        run: python ChatLensOCR/test_ocr_round5.py
      - name: Round 6 real Korean OCR and unreadable-bubble preservation
        run: python ChatLensOCR/test_ocr_round6.py
      - name: Round 7 real-pixel Korean suffix reread regression
        run: python ChatLensOCR/test_ocr_round7.py
      - name: Round 8 TXT review and JSON data integrity test
        run: python ChatLensOCR/test_ocr_round8.py
      - name: Overall chat classification and specialized OCR
        run: python ChatLensOCR/test_layout_v2.py
      - name: Validate candidate modules and bundled icon resources
        run: |
          $tests = @(
            "test_focused_tooltip_v050.py",
            "test_ffxiv_header_v050.py",
            "test_ffxiv_chromatic_v050.py",
            "test_ffxiv_viewer_crop_v047.py",
            "test_ffxiv_damaged_header_v048.py",
            "test_ffxiv_line_segmentation_v048.py",
            "test_ffxiv_progress_v047.py",
            "test_auto_job_icons_v047.py",
            "test_panel_grid_border_v0425.py",
            "test_panel_grid_integration.py",
            "test_inflight_result_switch_v0423.py",
            "test_qa_offline_v0421.py",
            "test_tesseract_single_pass_v049.py"
          )
          foreach ($test in $tests) {
            python "ChatLensOCR/$test"
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $test" }
          }
          python ChatLensOCR/test_ffxiv_icon_tile_v050.py --bundled-assets
          if ($LASTEXITCODE -ne 0) { throw "Bounded icon matcher failed" }
      - name: Build single Windows GUI executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ChatLensOCR_v0.5.0-rc.2 --version-file ChatLensOCR/version_info.txt --collect-all rapidocr --collect-all onnxruntime --collect-all cv2 --hidden-import=pytesseract --hidden-import=explorer_v1 --hidden-import=colored_page --hidden-import=pvp_v2 --hidden-import=focused_tooltip_v050 --hidden-import=ffxiv_header_v050 --hidden-import=ffxiv_chromatic_v050 --hidden-import=ffxiv_icon_tile_v050 --hidden-import=kakao_stickers --hidden-import=kakao_korean --hidden-import=sticker_match_v035 --hidden-import=kakao_names_v036 --hidden-import=ffxiv_combat_v037 --hidden-import=ffxiv_scoreboard_v037 --hidden-import=multicolumn_v037 --hidden-import=shop_grid_v0374 --hidden-import=ffxiv_latin_v0422 --hidden-import=ui_input_v042 --hidden-import=kakao_fidelity_v043 --hidden-import=kakao_integrity_v044 --hidden-import=kakao_tail_rescue_v045 --hidden-import=review_v046 --hidden-import=tess_backend --hidden-import=ocr_guard_v0372 --hidden-import=debuglog_v0372 --hidden-import=batch_v0372 --hidden-import=test_export_v0373 --add-data "$env:ProgramFiles\Tesseract-OCR;tesseract" --add-data "ChatLensOCR/assets;assets" --add-data "ChatLensOCR/models;models" --add-data "ChatLensOCR/LICENSE;." --add-data "ChatLensOCR/NOTICE.md;." --hidden-import=rapidocr --hidden-import=onnxruntime ChatLensOCR/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Verify 2bornot EXE metadata
        run: |
          $info=(Get-Item (Resolve-Path "dist/ChatLensOCR_v0.5.0-rc.2.exe")).VersionInfo
          if ($info.CompanyName -ne "2bornot") { throw "CompanyName mismatch: $($info.CompanyName)" }
          if ($info.LegalCopyright -notmatch "2bornot") { throw "LegalCopyright missing" }
          if ($info.ProductName -ne "ChatLens OCR") { throw "ProductName mismatch" }
          if ($info.ProductVersion -ne "0.5.0.2") { throw "ProductVersion mismatch" }
          Write-Host "Verified developer 2bornot, Copyright 2026 and ProductVersion 0.5.0.2"
      - name: Verify frozen executable with network blocked
        run: |
          $p = Start-Process -FilePath (Resolve-Path ".\dist\ChatLensOCR_v0.5.0-rc.2.exe") -ArgumentList "--self-test", (Join-Path $PWD "selftest.json") -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json }
          if ($p.ExitCode -ne 0) { throw "OCR frozen selftest failed: $($p.ExitCode)" }
          Get-Content selftest.json
      - name: Validate and package QA artifact (no public release)
        run: |
          $exe = "dist/ChatLensOCR_v0.5.0-rc.2.exe"
          if ((Get-Item $exe).Length -lt 25MB) { throw "Executable unexpectedly small" }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item ChatLensOCR/LICENSE dist/LICENSE.txt
          Copy-Item ChatLensOCR/NOTICE.md dist/NOTICE.md
          Copy-Item ChatLensOCR/PRIVACY.md dist/PRIVACY.md
          $zip = "dist/ChatLensOCR_v0.5.0-rc.2_Windows_x64.zip"
          Compress-Archive -Path $exe,dist/LICENSE.txt,dist/NOTICE.md,dist/PRIVACY.md -DestinationPath $zip -Force
          $check = Join-Path $env:RUNNER_TEMP "ChatLensCandidateVerify"
          Expand-Archive -Path $zip -DestinationPath $check -Force
          if ((Get-FileHash (Join-Path $check "ChatLensOCR_v0.5.0-rc.2.exe") -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw "Archive checksum mismatch" }
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$sha  ChatLensOCR_v0.5.0-rc.2.exe", "$zipSha  ChatLensOCR_v0.5.0-rc.2_Windows_x64.zip") | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          @{
            version = "0.5.0-rc.2"
            pe_version = "0.5.0.2"
            developer = "2bornot"
            source_sha = $env:GITHUB_SHA
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            released_publicly = $false
            authenticode_signed = $false
            private_cer = "NOT_RUN"
          } | ConvertTo-Json | Set-Content dist/build-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ChatLensOCR-v050-rc2-Windows-QA
          path: |
            dist/ChatLensOCR_v0.5.0-rc.2_Windows_x64.zip
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            selftest.json
          if-no-files-found: error
          retention-days: 7
