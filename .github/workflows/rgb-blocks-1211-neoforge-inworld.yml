name: RGB Blocks 1.21.1 NeoForge real client/server GUI smoke
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/test_mc1211_neoforge_inworld.py'
      - 'rgb-blocks-compat/build_mc1211_neoforge.py'
      - 'rgb-blocks-compat/validate_full_parity.py'
      - '.github/workflows/rgb-blocks-1211-neoforge-inworld.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge-inworld:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Python syntax before costly Gradle build
        run: python3 -m py_compile rgb-blocks-compat/test_mc1211_neoforge_inworld.py rgb-blocks-compat/inject_ci_only_light_probe.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install software OpenGL, X virtual display and screenshot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
          xvfb-run -a glxinfo -B | tail -n 12
      - name: Generate NeoForge 1.21.1 port and build native release-mapped JAR
        run: |
          set -euxo pipefail
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
          cd port-work/mc1211-neoforge
          gradle --no-daemon build
      - name: Verify original resource palette/model parity
        run: python3 rgb-blocks-compat/validate_full_parity.py neoforge1211
      - name: Launch real NeoForge client, C&B, Sodium, Iris and RGB server test scene
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_inworld.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-NEOFORGE-inworld-screenshot-logs-and-gates
          path: mc1211-neoforge-inworld/evidence/
          retention-days: 30
