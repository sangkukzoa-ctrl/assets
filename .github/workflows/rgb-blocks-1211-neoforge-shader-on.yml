name: RGB Blocks 1.21.1 NeoForge Iris Complementary shader ON RGB scene
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/test_mc1211_neoforge_inworld.py'
      - '.github/workflows/rgb-blocks-1211-neoforge-shader-on.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complementary-on:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Install Mesa software OpenGL and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
      - name: Generate native NeoForge 1.21.1 release code and compile
        run: |
          set -euxo pipefail
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
          cd port-work/mc1211-neoforge
          gradle --no-daemon build
      - name: Verify original RGB asset/models parity
        run: python3 rgb-blocks-compat/validate_full_parity.py neoforge1211
      - name: Require Iris shader ON with Complementary Reimagined in actual RGB building scene
        env:
          RGB_PORT_SHADER_ON: '1'
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_inworld.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-NEOFORGE-complementary-shader-ON-screenshot-and-iris-logs
          path: mc1211-neoforge-inworld/evidence/
          retention-days: 30
