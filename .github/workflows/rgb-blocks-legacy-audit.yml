name: RGB Blocks legacy upstream compatibility audit
on:
  push:
    branches:
      - rgb-blocks-legacy-compat-audit
    paths:
      - 'rgb-blocks-compat/**'
      - '.github/workflows/rgb-blocks-legacy-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-upstream-jars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect actual published mod JARs and Modrinth dependency declarations
        run: python rgb-blocks-compat/verify_upstream.py
      - name: Fingerprint official RGB Blocks 1.3.1 published asset bytes
        run: python rgb-blocks-compat/verify_baseline_assets.py
      - name: Self-test RGB Blocks asset/name release gate (not a port verification)
        run: python rgb-blocks-compat/check_candidate.py --self-test
      - name: Inventory 26.1.2 Java class and rendering API references
        run: python rgb-blocks-compat/inspect_code_api.py
      - name: Compare original RGB Blocks Chisels and Bits class and method API against target jars
        run: python rgb-blocks-compat/api_boundary_diff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgb-blocks-upstream-audit
          path: audit-output/
          retention-days: 14
