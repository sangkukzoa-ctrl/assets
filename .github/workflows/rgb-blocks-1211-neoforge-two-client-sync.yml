name: RGB Blocks 1.21.1 NeoForge TWO real clients live RGB and C&B sync
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/test_mc1211_neoforge_two_clients.py'
      - 'rgb-blocks-compat/inject_ci_neoforge_two_client_probe.py'
      - 'rgb-blocks-compat/inject_ci_only_light_probe.py'
      - 'rgb-blocks-compat/build_mc1211_neoforge.py'
      - '.github/workflows/rgb-blocks-1211-neoforge-two-client-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge-dual-client:
    if: github.event_name == 'workflow_dispatch' || (vars.RGB_OWNER_SOURCE_READY == 'true' && vars.RGB_FULL_MATRIX == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Preflight strict NeoForge two-client and probe syntax
        run: |
          python3 -m py_compile rgb-blocks-compat/test_mc1211_neoforge_two_clients.py rgb-blocks-compat/inject_ci_neoforge_two_client_probe.py rgb-blocks-compat/inject_ci_only_light_probe.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure Linux graphical clients and screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
      - name: Stage original NeoForge 1.21.1 and CI-only two-client probes
        run: |
          set -euxo pipefail
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
          python3 rgb-blocks-compat/inject_ci_only_light_probe.py neoforge1211
          python3 rgb-blocks-compat/inject_ci_neoforge_two_client_probe.py
      - name: Compile strict NeoForge client and server test JAR
        working-directory: port-work/mc1211-neoforge
        run: gradle --no-daemon build
      - name: Connect TWO real NeoForge production clients and check RGB/C&B per-channel dynamic sync
        env:
          RGB_PORT_STRICT_LIGHT_PROBE: '1'
          RGB_PORT_SHADER_ON: '0'
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_two_clients.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-neoforge-two-real-clients-mode-rgb-cnb-and-logs
          path: |
            mc1211-neoforge-two-clients/evidence/
            port-work/mc1211-neoforge/build/reports/
          retention-days: 30
