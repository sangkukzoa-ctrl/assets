name: RGB Blocks 1.20.1 Forge REAL production client GUI
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/test_mc1201_forge_production_client.py'
      - '.github/workflows/rgb-blocks-1201-production-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Setup Xvfb software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
          xvfb-run -a glxinfo -B | tail -n 12
      - name: Generate and compile Minecraft 1.20.1 Forge RGB Blocks JAR
        run: |
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
          cd port-work/mc1201-forge
          gradle --no-daemon build
      - name: Launch normal production-mapped Forge with RGB+C&B+Embeddium+Oculus
        run: python3 rgb-blocks-compat/test_mc1201_forge_production_client.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1201-forge-PRODUCTION-client-evidence
          path: mc1201-forge-production-client-test/
          retention-days: 30
