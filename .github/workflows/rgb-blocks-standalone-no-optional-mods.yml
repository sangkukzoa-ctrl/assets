name: RGB Blocks STANDALONE without C&B renderer shaders real server native BOTH loaders
on:
  workflow_dispatch:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - '.github/workflows/rgb-blocks-standalone-no-optional-mods.yml'
      - 'rgb-blocks-compat/test_mc1211_neoforge_server.py'
      - 'rgb-blocks-compat/test_mc1201_forge_server.py'
      - 'rgb-blocks-compat/build_mc1211_neoforge.py'
      - 'rgb-blocks-compat/build_mc1201_forge.py'
      - 'rgb-blocks-compat/recovered/neoforge/com/rgbblocks/mixin/RGBBlocksMixinPlugin.java'
permissions:
  contents: read
jobs:
  no-cnb-neoforge1211:
    if: github.event_name == 'workflow_dispatch' || vars.RGB_OWNER_SOURCE_READY == 'true'
    name: Actual NeoForge server ONE RGB JAR only, all RGB blocks and persistent commands
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Standalone server runner syntax
        run: python3 -m py_compile rgb-blocks-compat/test_mc1211_neoforge_server.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native NeoForge RGB-only JAR (no mod dependency)
        run: |
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
          cd port-work/mc1211-neoforge
          gradle --no-daemon build
      - name: Assert actual NeoForge dedicated game BOOTS without optional mods, persists RGB normal glow glass and commands
        env:
          RGB_PORT_STANDALONE_NO_CNB: '1'
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RGBBlocks-1.3.1-NEOFORGE-real-standalone-without-CNB-evidence
          path: |
            mc1211-neoforge-runtime/*log
            mc1211-neoforge-runtime/result.json
          retention-days: 30
  no-cnb-forge1201:
    if: github.event_name == 'workflow_dispatch' || vars.RGB_OWNER_SOURCE_READY == 'true'
    name: Actual Forge server ONE RGB JAR only, all RGB blocks and persistent commands
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Standalone server runner syntax
        run: python3 -m py_compile rgb-blocks-compat/test_mc1201_forge_server.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile native Forge RGB-only JAR (no mod dependency)
        run: |
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
          cd port-work/mc1201-forge
          gradle --no-daemon build
      - name: Assert actual Forge dedicated game BOOTS without optional mods, persists RGB normal glow glass and commands
        env:
          RGB_PORT_STANDALONE_NO_CNB: '1'
        run: python3 rgb-blocks-compat/test_mc1201_forge_server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RGBBlocks-1.3.1-FORGE-real-standalone-without-CNB-evidence
          path: |
            mc1201-forge-runtime/*log
            mc1201-forge-runtime/result.json
          retention-days: 30
