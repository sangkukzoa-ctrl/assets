name: PDF Image v1.3.0 — signed public release
on:
  push:
    branches:
      - 'pdfimage-ci/v1.3.0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore bilingual source
        shell: bash
        run: |
          set -euo pipefail
          cat _pdfimage_release_payload/part*.txt | base64 -d > /tmp/pdfimage-v1.3.0.tar.bz2
          echo '65029081a0c0c985ebdf2dce2405c0f73209eeb324edddf32714a9dd182fd6e3  /tmp/pdfimage-v1.3.0.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/pdfimage-v1.3.0.tar.bz2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests + Android builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdf-tests
          javac -d /tmp/pdf-tests app/src/main/java/com/hsiwan/pdfimage/L10n.java app/src/main/java/com/hsiwan/pdfimage/PageSelection.java tests/PageSelectionTest.java
          java -cp /tmp/pdf-tests PageSelectionTest
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Generate unique release key, sign APK/AAB, encrypt key backup
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          printf '%s\n' "$PASS" > "$RUNNER_TEMP/ks_pass"
          chmod 600 "$RUNNER_TEMP/ks_pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/pdfimage-upload.p12" -storetype PKCS12 \
            -alias pdfimage -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname 'CN=PDF Image,O=PDF Image contributors,C=KR' -noprompt
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/pdfimage-upload.p12" --ks-key-alias pdfimage \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out PDFImage-v1.3.0-Android.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs PDFImage-v1.3.0-Android.apk
          jarsigner -keystore "$RUNNER_TEMP/pdfimage-upload.p12" \
            -storepass "$PASS" -keypass "$PASS" \
            -signedjar PDFImage-v1.3.0-Play.aab \
            app/build/outputs/bundle/release/app-release.aab pdfimage
          jarsigner -verify PDFImage-v1.3.0-Play.aab
          tar -czf "$RUNNER_TEMP/upload-key-plaintext.tar.gz" -C "$RUNNER_TEMP" pdfimage-upload.p12 ks_pass
          openssl cms -encrypt -binary -aes256 \
            -in "$RUNNER_TEMP/upload-key-plaintext.tar.gz" -outform DER \
            -out "$RUNNER_TEMP/pdfimage-upload-key-encrypted.p7m" \
            .github/pdfimage-release-backup-recipient.crt
          chmod 600 "$RUNNER_TEMP/pdfimage-upload-key-encrypted.p7m"
          sha256sum PDFImage-v1.3.0-Android.apk PDFImage-v1.3.0-Play.aab > SHA256SUMS.txt
      - name: Backup encrypted upload key (private certificate stays off GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: pdfimage-v1.3.0-encrypted-signing-key-backup
          path: ${{ runner.temp }}/pdfimage-upload-key-encrypted.p7m
          retention-days: 30
          if-no-files-found: error
      - name: Prepare transparent source archive
        run: |
          zip -q -r PDFImage-v1.3.0-Source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties gradle gradlew gradlew.bat README.md RELEASE_NOTES.md LICENSE NOTICE.md tests docs .github/workflows/build.yml
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 PDFImage-v1.3.0-Android.apk PDFImage-v1.3.0-Play.aab PDFImage-v1.3.0-Source.zip SHA256SUMS.txt --clobber
            gh release edit v1.3.0 --title 'PDF Image v1.3.0 — Korean / English' --notes-file RELEASE_NOTES.md
          else
            gh release create v1.3.0 PDFImage-v1.3.0-Android.apk PDFImage-v1.3.0-Play.aab PDFImage-v1.3.0-Source.zip SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title 'PDF Image v1.3.0 — Korean / English' \
              --notes-file RELEASE_NOTES.md --latest
          fi