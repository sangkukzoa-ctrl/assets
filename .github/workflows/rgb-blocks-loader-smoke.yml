name: RGB Blocks upstream Fabric loader pre-EULA smoke
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/fabric_loader_smoke.py'
      - '.github/workflows/rgb-blocks-loader-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric-upstream-pre-eula:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check C&B 21.1.40 and Fabric API 0.116.17 load to EULA gate without accepting it
        run: python rgb-blocks-compat/fabric_loader_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgb-blocks-fabric-upstream-pre-eula-logs
          path: audit-output/
          retention-days: 14
