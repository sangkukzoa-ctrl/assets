name: RGB Blocks 1.21.1 NeoForge complete ecosystem test MRPACK
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/package_ecosystem.py'
      - '.github/workflows/rgb-blocks-1211-neoforge-mrpack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate official NeoForge port and compile production RGB Blocks JAR
        run: |
          set -euxo pipefail
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
          cd port-work/mc1211-neoforge
          gradle --no-daemon build
      - name: Verify full RGB 1.3.1 source asset/model parity
        run: python3 rgb-blocks-compat/validate_full_parity.py neoforge1211
      - name: Create Modrinth compatible pinned NeoForge C&B Sodium Iris Complementary profile
        run: python3 rgb-blocks-compat/package_ecosystem.py neoforge1211
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-NEOFORGE-complete-test-modpack-and-lock
          path: |
            rgb-blocks-compat/packages/RGBBlocks-1.3.1-MC1.21.1-neoforge-complete-ecosystem.mrpack
            rgb-blocks-compat/packages/RGBBlocks-1.3.1-MC1.21.1-neoforge-complete-ecosystem-lock.json
          retention-days: 30
