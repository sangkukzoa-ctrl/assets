name: RGB Blocks 1.21.1 real in-world Fabric multiplayer color scene
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths: ['rgb-blocks-compat/test_mc1211_fabric_inworld.py','.github/workflows/rgb-blocks-1211-inworld.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.12.1'}
      - name: Install software OpenGL virtual display and screenshot support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
      - name: Compile RGB Blocks 1.21.1 Fabric full actual JAR
        run: |
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          cd port-work/mc1211-fabric
          gradle --no-daemon build
      - name: Run REAL Fabric RGB color and texture test on dedicated server with actual client
        run: python3 rgb-blocks-compat/test_mc1211_fabric_inworld.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-inworld-real-multiplayer-scene-and-logs
          path: mc1211-fabric-inworld/evidence/
          retention-days: 30
