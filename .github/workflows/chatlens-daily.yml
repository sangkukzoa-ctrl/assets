name: ChatLens OCR daily Windows QA and stable beta release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatlens-daily.yml']
  schedule:
    - cron: '0 19 * * *' # Every day 04:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
concurrency:
  group: chatlens-daily-dev
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatlens-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Python syntax gate before expensive OCR dependencies
        run: python -m compileall -q ChatLensOCR
      - name: Verify versioned result export before dependency installation
        run: python ChatLensOCR/test_export_v0373_regression.py
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rapidocr>=3.10,<4" "onnxruntime>=1.20,<2" "opencv-python-headless>=4.8" "Pillow>=10" "numpy>=1.26,<3" "pyinstaller>=6.10,<7" "pytesseract>=0.3.13,<1"
      - name: Install Tesseract
        run: choco install tesseract -y --no-progress
      - name: Add Korean OCR data
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/kor.traineddata' -OutFile (Join-Path $env:ProgramFiles 'Tesseract-OCR/tessdata/kor.traineddata')
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata' -OutFile (Join-Path $env:ProgramFiles 'Tesseract-OCR/tessdata/eng.traineddata')
      - name: Download job icons
        run: |
          @'
          import io, zipfile, urllib.request, pathlib
          url="https://github.com/xivapi/classjob-icons/archive/refs/heads/master.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"ChatLensOCR-build"})
          with urllib.request.urlopen(req, timeout=90) as res: z=zipfile.ZipFile(io.BytesIO(res.read()))
          target=pathlib.Path("ChatLensOCR/assets/jobs");target.mkdir(parents=True,exist_ok=True)
          for name in z.namelist():
              if "/icons/" in name and name.endswith(".png"):
                  (target/pathlib.Path(name).name).write_bytes(z.read(name))
          print("icons",len(list(target.glob("*.png"))))
          assert len(list(target.glob("*.png")))>=40
          '@ | python -
      - name: Warm up three OCR languages
        run: |
          @'
          import sys, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          sys.path.insert(0,"ChatLensOCR")
          from app import recognize
          img=Image.new("RGB",(1000,220),"white")
          font=ImageFont.truetype("C:/Windows/Fonts/arial.ttf",60)
          ImageDraw.Draw(img).text((20,60),"CHATLENS OCR 12345",fill="black",font=font)
          for lang in ["한국어","영어","일본어"]:
              found=recognize(img,lang,False)
              print("model loaded",repr(lang),len(found),flush=True)
              assert found, "OCR failed"
          import rapidocr
          source=Path(rapidocr.__file__).parent/"models"
          target=Path("ChatLensOCR/models")
          shutil.copytree(source,target,dirs_exist_ok=True)
          files=list(target.rglob("*.onnx"))
          print("ONNX models",len(files),[p.name for p in files],flush=True)
          assert len(files)>=4
          '@ | python -
      - name: Verify Tesseract single-pass TXT, TSV and integer confidence compatibility twice
        run: |
          foreach ($round in 1..2) {
            Write-Host "Tesseract compatibility regression $round/2"
            python ChatLensOCR/test_tesseract_single_pass_v049.py
            if ($LASTEXITCODE -ne 0) { throw "Tesseract TXT/TSV regression $round failed" }
          }
      - name: Human-readable Korean pixel OCR and anti-hallucination regression
        run: |
          foreach ($round in 1..2) {
            Write-Host "Human readability / exact pixel text pass $round/2"
            python ChatLensOCR/test_human_readability_v0410.py
            if ($LASTEXITCODE -ne 0) { throw "Korean semantic fidelity regression failed" }
          }
      - name: Reject false FFXIV scoreboards and dark editor panels
        run: |
          foreach ($round in 1..2) {
            python ChatLensOCR/test_mode_discrimination_v0411.py
            if ($LASTEXITCODE -ne 0) { throw "Pixel layout discrimination regression $round failed" }
          }
      - name: Run three-mode synthetic screenshot OCR tests
        run: python ChatLensOCR/test_layout_v2.py
      - name: Test resize exception guard and debug log with product screenshots
        run: python ChatLensOCR/test_resize_debug_v0372.py
      - name: Validate versioned TXT test-result export
        run: python ChatLensOCR/test_export_v0373_regression.py
      - name: Validate multi-column shopping-card segmentation
        run: python ChatLensOCR/test_shop_grid_v0374.py
      - name: Validate field-test release metadata
        run: python ChatLensOCR/test_release_v0410.py
      - name: Round 1 regression (Kakao nickname and micro-bubbles)
        run: python ChatLensOCR/test_ocr_round1.py
      - name: Round 2 regression (multiline fidelity)
        run: python ChatLensOCR/test_ocr_round2.py
      - name: Round 3 regression (FFXIV mixed Latin)
        run: python ChatLensOCR/test_ocr_round3.py
      - name: Round 3 regression (Explorer metadata cells)
        run: python ChatLensOCR/test_explorer_cells_v0422.py
      - name: Round 4 regression (general UI and image input)
        run: python ChatLensOCR/test_ocr_round4.py
      - name: Round 5 fidelity, short syllable and punctuation regression
        run: python ChatLensOCR/test_ocr_round5.py
      - name: Round 6 real Korean OCR and unreadable-bubble preservation
        run: python ChatLensOCR/test_ocr_round6.py
      - name: Round 7 real-pixel Korean suffix reread regression
        run: python ChatLensOCR/test_ocr_round7.py
      - name: Round 8 TXT review and JSON data integrity test
        run: python ChatLensOCR/test_ocr_round8.py
      # Verify screenshot layout without publishing any personal chat images.
      - name: Embedded desktop JPEGView FFXIV screenshot regression
        run: python ChatLensOCR/test_ffxiv_viewer_crop_v047.py
      - name: Report real FFXIV row-level analysis progress
        run: python ChatLensOCR/test_ffxiv_progress_v047.py
      - name: FFXIV bright-background chat row segmentation regression
        run: |
          foreach ($round in 1..3) {
            python ChatLensOCR/test_ffxiv_line_segmentation_v048.py
            if ($LASTEXITCODE -ne 0) { throw "FFXIV row segmentation failed on repeat $round" }
          }
      - name: Repeated FFXIV damaged header and system classification regression
        run: |
          foreach ($round in 1..3) {
            Write-Host "FFXIV damaged-header regression pass $round/3"
            python ChatLensOCR/test_ffxiv_damaged_header_v048.py
            if ($LASTEXITCODE -ne 0) { throw "FFXIV damaged-header regression failed on repeat $round" }
          }
      - name: Automatic FFXIV job-icon learning and sticker continuity test
        run: python ChatLensOCR/test_auto_job_icons_v047.py
      - name: Overall chat classification and specialized OCR
        run: python ChatLensOCR/test_layout_v2.py
      - name: Build single Windows GUI executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ChatLensOCR_v0.4.11 --version-file ChatLensOCR/version_info.txt --collect-all rapidocr --collect-all onnxruntime --collect-all cv2 --hidden-import=pytesseract --hidden-import=explorer_v1 --hidden-import=colored_page --hidden-import=pvp_v2 --hidden-import=kakao_stickers --hidden-import=kakao_korean --hidden-import=sticker_match_v035 --hidden-import=kakao_names_v036 --hidden-import=ffxiv_combat_v037 --hidden-import=ffxiv_scoreboard_v037 --hidden-import=multicolumn_v037 --hidden-import=shop_grid_v0374 --hidden-import=ffxiv_latin_v0422 --hidden-import=ui_input_v042 --hidden-import=kakao_fidelity_v043 --hidden-import=kakao_integrity_v044 --hidden-import=kakao_tail_rescue_v045 --hidden-import=review_v046 --hidden-import=auto_job_samples_v047 --hidden-import=ffxiv_viewer_crop_v047 --hidden-import=ffxiv_fidelity_v0410 --hidden-import=tess_backend --hidden-import=ocr_guard_v0372 --hidden-import=debuglog_v0372 --hidden-import=batch_v0372 --hidden-import=test_export_v0373 --add-data "$env:ProgramFiles\Tesseract-OCR;tesseract" --add-data "ChatLensOCR/assets;assets" --add-data "ChatLensOCR/models;models" --add-data "ChatLensOCR/LICENSE;." --add-data "ChatLensOCR/NOTICE.md;." --hidden-import=rapidocr --hidden-import=onnxruntime ChatLensOCR/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Verify 2bornot EXE metadata
        run: |
          $info=(Get-Item (Resolve-Path "dist/ChatLensOCR_v0.4.11.exe")).VersionInfo
          if ($info.CompanyName -ne "2bornot") { throw "CompanyName mismatch: $($info.CompanyName)" }
          if ($info.LegalCopyright -notmatch "2bornot") { throw "LegalCopyright missing" }
          if ($info.ProductName -ne "ChatLens OCR") { throw "ProductName mismatch" }
          if ($info.ProductVersion -ne "0.4.11.0") { throw "ProductVersion mismatch" }
          Write-Host "Verified developer 2bornot, Copyright 2026 and ProductVersion 0.4.11.0"
      - name: Verify frozen executable with network blocked
        run: |
          $p = Start-Process -FilePath (Resolve-Path ".\dist\ChatLensOCR_v0.4.11.exe") -ArgumentList "--self-test", (Join-Path $PWD "selftest.json") -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json }
          if ($p.ExitCode -ne 0) { throw "OCR frozen selftest failed: $($p.ExitCode)" }
          Get-Content selftest.json
      - name: Authenticode-sign EXE if a trusted certificate is configured
        id: codesign
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CHATLENS_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CHATLENS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGN_PFX_BASE64 -or -not $env:CODE_SIGN_PFX_PASSWORD) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "No trusted certificate configured: release will be explicitly unsigned prerelease."
            exit 0
          }
          $cert = Join-Path $env:RUNNER_TEMP 'chatlens_signing.pfx'
          $exe = (Resolve-Path 'dist/ChatLensOCR_v0.4.11.exe').Path
          try {
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw 'Windows SDK SignTool is missing' }
            & $signtool sign /f $cert /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            & $signtool verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verify failed' }
            "signed=true" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $cert -Force -ErrorAction SilentlyContinue
          }
      - name: Create and validate release archive
        run: |
          $exe = (Resolve-Path "dist/ChatLensOCR_v0.4.11.exe").Path
          $zip = "dist/ChatLensOCR_v0.4.11_Windows_x64.zip"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item $exe).Length -lt 25MB) { throw "Executable unexpectedly small" }
          Copy-Item "ChatLensOCR/LICENSE" "dist/LICENSE.txt"
          Copy-Item "ChatLensOCR/NOTICE.md" "dist/NOTICE.md"
          Copy-Item "ChatLensOCR/PRIVACY.md" "dist/PRIVACY.md"
          Compress-Archive -Path $exe,"dist/LICENSE.txt","dist/NOTICE.md","dist/PRIVACY.md" -DestinationPath $zip -CompressionLevel Optimal -Force
          $check = Join-Path $env:RUNNER_TEMP "ChatLensVerify"
          New-Item -ItemType Directory -Force -Path $check | Out-Null
          Expand-Archive -Path $zip -DestinationPath $check -Force
          $extracted = (Get-FileHash (Join-Path $check "ChatLensOCR_v0.4.11.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $extracted) { throw "Archive checksum mismatch" }
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$sha  ChatLensOCR_v0.4.11.exe"
            "$zipSha  ChatLensOCR_v0.4.11_Windows_x64.zip"
          ) | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"
          Write-Host "EXE bytes: $((Get-Item $exe).Length)"
          Write-Host "ZIP bytes: $((Get-Item $zip).Length)"
          Write-Host "ZIP extract checksum verified"
      - name: Attest binary build provenance (different from Authenticode)
        uses: actions/attest@v4
        with:
          subject-path: dist/ChatLensOCR_v0.4.11.exe
      - name: Record QA-only build manifest
        env:
          CODE_SIGNED: ${{ steps.codesign.outputs.signed }}
        run: |
          $json = @{
            application = "ChatLens OCR"
            version = "0.4.11"
            qa_round = "nightly-development"
            developer = "2bornot"
            released_publicly = $false
            authenticode_signed = ($env:CODE_SIGNED -eq "true")
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            source_sha = (git rev-parse HEAD).Trim()
          } | ConvertTo-Json
          $json | Set-Content -LiteralPath dist/build-manifest.json -Encoding utf8
          "## ChatLens OCR nightly development build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Binary selftest, baseline OCR regressions, job-icon auto-learning test, SHA256 verification and provenance attestation passed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:CODE_SIGNED -eq "true") {
            "Authenticode: verified signature" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "Authenticode: UNSIGNED, awaiting trusted certificate and SignPath Foundation approval." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "QA-gated daily build from chatlens-development. Public beta assets refresh only after checks pass; blog URL stays fixed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ChatLensOCR-Daily-${{ github.run_number }}-Windows-x64
          path: |
            dist/ChatLensOCR_v0.4.11_Windows_x64.zip
            dist/SHA256SUMS.txt
            dist/LICENSE.txt
            dist/NOTICE.md
            dist/PRIVACY.md
            dist/build-manifest.json
            selftest.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatLensOCR-Daily-Reports-${{ github.run_number }}
          path: |
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            selftest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare stable single-page beta distribution
        if: success()
        run: |
          $exe = "dist/ChatLensOCR_v0.4.11.exe"
          $zip = "dist/ChatLensOCR_v0.4.11_Windows_x64.zip"
          Copy-Item $exe "dist/ChatLensOCR.exe" -Force
          Copy-Item $zip "dist/ChatLensOCR-Windows-x64.zip" -Force
          $shaExe=(Get-FileHash "dist/ChatLensOCR.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaZip=(Get-FileHash "dist/ChatLensOCR-Windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$shaExe  ChatLensOCR.exe"
            "$shaZip  ChatLensOCR-Windows-x64.zip"
          ) | Set-Content "dist/SHA256SUMS-LATEST.txt" -Encoding ascii
          $head=(git rev-parse HEAD).Trim()
          $stamp=(Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
          @"
          # ChatLens OCR — 무료 공개 테스트판 (Beta)

          **최신 개발 빌드: v0.4.11 | $stamp | 개발자: 2bornot**

          **개발 중이며 문자 인식 정확도는 아직 불안정합니다.** 복잡한 화면의 글자 오인식과 일부 문장 누락이 발생할 수 있습니다. 정확도와 안정성을 계속 개선하고 있습니다. 중요한 내용은 원본 이미지와 대조해 주세요.

          ## 고정 다운로드
          - **ChatLensOCR.exe**: Windows x64 단독 실행파일 (Python 설치 불필요)
          - **ChatLensOCR-Windows-x64.zip**: 실행파일, 라이선스 및 안내문이 포함된 ZIP
          - **SHA256SUMS-LATEST.txt**: EXE·ZIP 무결성 검증
          - **ChatLensOCR_SOURCE.zip**: 정확히 이번 빌드에 사용한 개발 소스

          ## 기능
          이미지 열기·스크린샷 붙여넣기, 자동/범용/쇼핑몰/카카오톡/파판14/파일 탐색기 판독, 한국어·영어·일본어, 일괄 OCR, 선택영역, 직업 아이콘 자동 인식·로컬 고신뢰 자동 학습, 카카오톡 스티커 인식, TXT·JSON 내보내기, 디버그 로그.

          ## 이번 검증
          - 1~8차 기존 회귀 검사 + 실제 화면 뷰어/FFXIV 채팅 혼입 방지 검사
          - v0.4.9: Tesseract TXT/TSV 단일 실행 최적화 및 기존 OCR 결과 일치 검사
          - v0.4.10: 파판14 채팅의 이미지 픽셀 기반 다중 판독·문자 의미 보존, 정답 텍스트 대조 및 임의 추론 방지 검사\n          - v0.4.11: 166장 실사용 화면 분석에 따른 비FF14 편집기·분홍색 지원 대화·자막·아이템 창 오분류 억제 (원본 비공개)\n          - v0.4.11: 실제 FF14 스코어보드 및 일반 채팅을 보존하는 합성 회귀 2회
          - Windows 오프라인 EXE 자체실행 및 ZIP SHA256 검증 통과
          - 프로그램 소스: $head
          - 이전 버전은 Releases의 개별 버전 태그에 보존
          - 현재 **Windows 공인 코드서명 미적용**: 알 수 없는 게시자/SmartScreen 경고가 표시될 수 있음

          **네이버 블로그 단일 게시글에서는 이 페이지 하나만 연결합니다.**
          "@ | Set-Content "dist/BETA_RELEASE_NOTES.md" -Encoding utf8
          git archive --format=zip --output="dist/ChatLensOCR_SOURCE.zip" HEAD ChatLensOCR
          if ($LASTEXITCODE -ne 0) { throw "Source archive creation failed" }
          Get-Content "dist/SHA256SUMS-LATEST.txt"
          if ($shaExe -ne (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw "Stable EXE does not match verified v0.4.11 binary"
          }
          if ($shaZip -ne (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw "Stable ZIP does not match verified v0.4.11 archive"
          }
      - name: Publish one permanent GitHub beta download page
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="chatlens-beta"
          $name="ChatLens OCR — 무료 공개 테스트판 (개발 중)"
          $repo=$env:GITHUB_REPOSITORY
          $head=(git rev-parse HEAD).Trim()
          $files=@("dist/ChatLensOCR.exe",
                   "dist/ChatLensOCR-Windows-x64.zip",
                   "dist/SHA256SUMS-LATEST.txt",
                   "dist/BETA_RELEASE_NOTES.md",
                   "dist/ChatLensOCR_SOURCE.zip")
          gh release view $tag --repo $repo 2>$null | Out-Null
          $exists=($LASTEXITCODE -eq 0)
          if ($exists) {
            gh release upload $tag $files --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) {throw "Stable asset upload failed"}
            gh api --method PATCH "repos/$repo/git/refs/tags/$tag" -f sha="$head" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) {throw "Moving beta source tag failed"}
            gh release edit $tag --repo $repo --title $name --notes-file "dist/BETA_RELEASE_NOTES.md" --prerelease
            if ($LASTEXITCODE -ne 0) {throw "Beta notes update failed"}
          } else {
            gh release create $tag $files --repo $repo --target $head --title $name --notes-file "dist/BETA_RELEASE_NOTES.md" --prerelease
            if ($LASTEXITCODE -ne 0) {throw "Beta release creation failed"}
          }
          gh release view $tag --repo $repo --json url,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) {throw "Public beta verification failed"}
          "## Fixed blog distribution URLs" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/$repo/releases/tag/chatlens-beta" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/$repo/releases/download/chatlens-beta/ChatLensOCR-Windows-x64.zip" >> $env:GITHUB_STEP_SUMMARY
