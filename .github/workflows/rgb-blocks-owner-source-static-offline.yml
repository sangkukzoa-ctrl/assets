name: RGB Blocks owner-original source first OFFLINE syntax and migration gate
on:
  workflow_dispatch:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/stage_owner_original.py'
      - 'rgb-blocks-compat/provision_original_source_private_once.ps1'
      - 'rgb-blocks-compat/verify_actual_cnb_dependency_jars.py'
      - 'rgb-blocks-compat/test_owner_private_release_source.py'
      - 'rgb-blocks-compat/build_mc1211_fabric.py'
      - 'rgb-blocks-compat/build_mc1211_neoforge.py'
      - 'rgb-blocks-compat/build_mc1201_forge.py'
      - 'rgb-blocks-compat/verify_owner_runtime_migration.py'
      - 'rgb-blocks-compat/verify_native_owner_mixin_inventory.py'
      - 'rgb-blocks-compat/test_source_first_pipeline_static.py'
      - 'rgb-blocks-compat/test_owner_source_runtime_transforms_offline.py'
      - 'rgb-blocks-compat/test_owner_forge_runtime_packets_offline.py'
      - 'rgb-blocks-compat/test_mc1201_forge_two_clients.py'
      - 'rgb-blocks-compat/test_mc1211_neoforge_two_clients.py'
      - 'rgb-blocks-compat/clone_owner_resources.py'
      - 'rgb-blocks-compat/test_clone_owner_resources.py'
      - '.github/workflows/rgb-blocks-*.yml'
      - 'rgb-blocks-compat/test_source_first_workflow_guard.py'
      - 'rgb-blocks-compat/test_cnb_mesh_oracle_javac.py'
      - 'rgb-blocks-compat/test_cnb_nonpublic_model_reflection_javac.py'
      - 'rgb-blocks-compat/test_cnb_mesh_tile_aba_javac.py'
      - 'rgb-blocks-compat/test_cnb_mesh_source_scan_churn_javac.py'
      - 'rgb-blocks-compat/test_cnb_live_source_reconcile_javac.py'
      - 'rgb-blocks-compat/test_cnb_missing_source_discovery_javac.py'
      - 'rgb-blocks-compat/test_cnb_blockinformation_accessors_javac.py'
      - 'rgb-blocks-compat/test_cnb_trailing_model_reflection_javac.py'
      - 'rgb-blocks-compat/test_cnb_lan_host_client_bake_javac.py'
      - 'rgb-blocks-compat/test_cnb_integrated_lan_probe_offline.py'
      - 'rgb-blocks-compat/inject_ci_integrated_probe.py'
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/cnb/RGBCnbGeometryBakeDebouncer.java'
      - 'rgb-blocks-compat/cnb_chaos_choreography.py'
      - 'rgb-blocks-compat/test_cnb_chaos_choreography_offline.py'
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/lighting/RGBRealLightEngine.java'
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/cnb/RGBCnbMeshIntegrity.java'
concurrency:
  group: rgbblocks-owner-source-static-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-static:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Parse PowerShell private owner source bootstrap script without uploading anything
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'rgb-blocks-compat/provision_original_source_private_once.ps1',
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }
          $content = Get-Content 'rgb-blocks-compat/provision_original_source_private_once.ps1' -Raw
          $remote = $content.IndexOf('gh release download')
          $digest = $content.IndexOf('Get-FileHash -LiteralPath $verifiedFile')
          $enable = $content.IndexOf('gh variable set RGB_OWNER_SOURCE_READY')
          if ($remote -lt 0 -or $digest -lt $remote -or $enable -lt $digest) {
            throw 'Never enable RGB original CI before SHA-verifying uploaded private DRAFT source'
          }
          Write-Output 'RGB_OWNER_PRIVATE_BOOTSTRAP_PARSE_AND_REMOTE_SHA_GATE_PASS'
      - name: Compile every owner source staging, migration and test script
        run: |
          python3 -m py_compile \
            rgb-blocks-compat/stage_owner_original.py \
            rgb-blocks-compat/build_mc1211_fabric.py \
            rgb-blocks-compat/build_mc1211_neoforge.py \
            rgb-blocks-compat/build_mc1201_forge.py \
            rgb-blocks-compat/verify_owner_runtime_migration.py \
            rgb-blocks-compat/verify_native_owner_mixin_inventory.py \
            rgb-blocks-compat/test_source_first_pipeline_static.py \
            rgb-blocks-compat/test_owner_source_runtime_transforms_offline.py \
            rgb-blocks-compat/test_owner_forge_runtime_packets_offline.py \
            rgb-blocks-compat/clone_owner_resources.py \
            rgb-blocks-compat/test_clone_owner_resources.py \
            rgb-blocks-compat/test_source_first_workflow_guard.py \
            rgb-blocks-compat/test_cnb_mesh_oracle_javac.py \
            rgb-blocks-compat/test_cnb_nonpublic_model_reflection_javac.py \
            rgb-blocks-compat/test_cnb_mesh_tile_aba_javac.py \
            rgb-blocks-compat/test_cnb_mesh_source_scan_churn_javac.py \
            rgb-blocks-compat/test_cnb_live_source_reconcile_javac.py \
            rgb-blocks-compat/test_cnb_missing_source_discovery_javac.py \
            rgb-blocks-compat/test_cnb_blockinformation_accessors_javac.py \
            rgb-blocks-compat/test_cnb_trailing_model_reflection_javac.py \
            rgb-blocks-compat/test_cnb_lan_host_client_bake_javac.py \
            rgb-blocks-compat/test_cnb_integrated_lan_probe_offline.py \
            rgb-blocks-compat/inject_ci_integrated_probe.py \
            rgb-blocks-compat/test_owner_private_release_source.py \
            rgb-blocks-compat/cnb_chaos_choreography.py \
            rgb-blocks-compat/test_cnb_chaos_choreography_offline.py
      - name: Execute ORIGINAL-SOURCE-FIRST migration and mixin regression selftest
        run: python3 rgb-blocks-compat/test_source_first_pipeline_static.py
      - name: PROVE converted glass, pack, and Mixin resources never mutate author source
        run: python3 rgb-blocks-compat/test_clone_owner_resources.py
      - name: Check all 31 legacy build workflows against source-first and bounded CI policy
        run: python3 rgb-blocks-compat/test_source_first_workflow_guard.py
      - name: Run actual production C&B voxel AIR/nonAIR, Forge and Neo Java reflection
        run: python3 rgb-blocks-compat/test_cnb_mesh_oracle_javac.py
      - name: Verify real C&B cross-package hidden API reflection with Java 17 and 21
        run: python3 rgb-blocks-compat/test_cnb_nonpublic_model_reflection_javac.py
      - name: Reproduce real C&B same-position ABA cooldown poisoning and reloads on Java 17 and 21
        run: python3 rgb-blocks-compat/test_cnb_mesh_tile_aba_javac.py
      - name: Stress actual C&B source iterator with 499 blocks, 90 churn rounds, and disconnect Java17/21
        run: python3 rgb-blocks-compat/test_cnb_mesh_source_scan_churn_javac.py
      - name: Reproduce REAL Forge BLUE->GREEN C&B stale source and ensure AUTO repair on Java17/21
        run: python3 rgb-blocks-compat/test_cnb_live_source_reconcile_javac.py
      - name: Offline mock GitHub unpublished author source release 404 / SHA-256 / public safety
        run: python3 rgb-blocks-compat/test_owner_private_release_source.py
      - name: Simulate genuine four-round hostile duel with FIVE deterministic seeds (no game claims)
        run: python3 rgb-blocks-compat/test_cnb_chaos_choreography_offline.py
      - name: Reproduce real NeoForge C&B voxel-present RGB-cache-absent reconnect on Java 17 and 21
        run: python3 rgb-blocks-compat/test_cnb_missing_source_discovery_javac.py
      - name: Execute actual 1.20.1 Forge getBlockState and 1.21.1 Neo record C&B RGB voxel-source calculation
        run: python3 rgb-blocks-compat/test_cnb_blockinformation_accessors_javac.py
      - name: Compile actual C&B rapid Bake last-model repair with inherited/nonpublic API on both JVM targets
        run: python3 rgb-blocks-compat/test_cnb_trailing_model_reflection_javac.py
      - name: Execute actual owner-derived 1.21.1 source builder Java compatibility transforms (no public download)
        run: python3 rgb-blocks-compat/test_owner_source_runtime_transforms_offline.py
      - name: RUN real original-order network and SavedData source conversion for Forge 1.20.1
        run: python3 rgb-blocks-compat/test_owner_forge_runtime_packets_offline.py
      - name: Test actual C&B rapid Bake LAN-host client and reject stale/server worlds on Java 17 and 21
        run: python3 rgb-blocks-compat/test_cnb_lan_host_client_bake_javac.py
      - name: Require real LAN host C&B guard in both original-world integrated game probes
        run: python3 rgb-blocks-compat/test_cnb_integrated_lan_probe_offline.py
      - name: Confirm the original RGB Blocks Modrinth source URL is absent from the active build
        run: |
          ! grep -E 'cdn.modrinth.com/data/A48MxLWx|api.modrinth.com/v2/project/A48MxLWx' \
            rgb-blocks-compat/build_mc1211_fabric.py \
            rgb-blocks-compat/stage_owner_original.py \
            rgb-blocks-compat/recover_author_sources.py
