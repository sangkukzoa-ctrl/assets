name: Siman Windows installer smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/siman-windows-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create old-install fixture and test update script
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'Siman_HeartEye_v1.3.0_INSTALL.zip'
          $encoded=Get-Content 'siman/release/Siman_HeartEye_v1.3.0_INSTALL.zip.base64' -Raw
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($encoded.Trim()))
          $dest=Join-Path $env:RUNNER_TEMP 'SimanRelease'
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          $target=Join-Path $env:LOCALAPPDATA '2bornot\Siman\app'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          '{"manifest_version":3,"name":"심안 (心眼) — AI 대화 통합 검색","version":"1.2.0"}' | Set-Content -Path (Join-Path $target 'manifest.json') -Encoding utf8
          'N' | & (Join-Path $dest '심안_설치_업데이트.ps1')
          $m=Get-Content -Path (Join-Path $target 'manifest.json') -Raw | ConvertFrom-Json
          if($m.version -ne '1.3.0'){throw "Version mismatch: $($m.version)"}
          if(-not (Test-Path -LiteralPath (Join-Path $target 'search.js'))){throw 'Missing updated search engine'}
          Write-Host 'SIMAN v1.3.0 WINDOWS AUTO-UPDATE PASS'
