name: RGB Blocks Forge 1.20.1 TRUE integrated singleplayer saved RGB C&B
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - '.github/workflows/rgb-blocks-1201-forge-integrated-singleplayer.yml'
      - 'rgb-blocks-compat/inject_ci_integrated_probe.py'
      - 'rgb-blocks-compat/test_mc1201_forge_two_clients.py'
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/lighting/RGBLightPersistence.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minecraft-real-integrated-singleplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Preflight actual integrated CI-only probe and strict existing two-client harness
        run: |
          python3 -m py_compile rgb-blocks-compat/inject_ci_integrated_probe.py rgb-blocks-compat/inject_ci_only_light_probe.py rgb-blocks-compat/inject_ci_two_client_sync_probe.py rgb-blocks-compat/inject_ci_mixed_cnb_probe.py rgb-blocks-compat/test_mc1201_forge_two_clients.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Prepare graphical Minecraft singleplayer and multi-client display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
      - name: Generate original full RGB/C&B build and CI-only integrated world probe
        run: |
          set -euxo pipefail
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
          python3 rgb-blocks-compat/inject_ci_only_light_probe.py forge1201
          python3 rgb-blocks-compat/inject_ci_two_client_sync_probe.py
          python3 rgb-blocks-compat/inject_ci_mixed_cnb_probe.py forge1201
          python3 rgb-blocks-compat/inject_ci_integrated_probe.py forge1201
      - name: Compile full RGB palette with mixed C&B and integrated-world probe
        working-directory: port-work/mc1201-forge
        run: gradle --no-daemon build
      - name: Strict two-client light and baked-snapshot tests, then open SAME WORLD as true integrated singleplayer
        env:
          RGB_PORT_TEST_MIXED_CNB: '1'
          RGB_PORT_TEST_INTEGRATED: '1'
        run: python3 rgb-blocks-compat/test_mc1201_forge_two_clients.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1201-forge-real-integrated-singleplayer-rgb-cnb-original-world
          path: |
            mc1201-forge-two-clients/evidence/
            port-work/mc1201-forge/build/reports/
          retention-days: 30
