name: RGB Blocks NeoForge 1.21.1 REAL MIXED C&B RGB glass Complementary ON 2 clients
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/lighting/RGBLightPersistence.java'
      - '.github/workflows/rgb-blocks-1211-neoforge-mixed-cnb-complementary-on.yml'
      - 'rgb-blocks-compat/test_mc1211_neoforge_two_clients.py'
      - 'rgb-blocks-compat/inject_ci_mixed_cnb_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-complementary-render-and-colored-mixed-bits:
    if: github.event_name == 'workflow_dispatch' || vars.RGB_OWNER_SOURCE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Strict mixed RGB/C&B shader scripts preflight
        run: |
          python3 -m py_compile rgb-blocks-compat/inject_ci_only_light_probe.py rgb-blocks-compat/inject_ci_neoforge_two_client_probe.py rgb-blocks-compat/inject_ci_mixed_cnb_probe.py rgb-blocks-compat/test_mc1211_neoforge_two_clients.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Install graphical Minecraft CI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
      - name: Stage source and CI-only 16-cubed RGB Glow Normal Glass microbits
        run: |
          set -euxo pipefail
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
          python3 rgb-blocks-compat/inject_ci_only_light_probe.py neoforge1211
          python3 rgb-blocks-compat/inject_ci_neoforge_two_client_probe.py
          python3 rgb-blocks-compat/inject_ci_mixed_cnb_probe.py neoforge1211
      - name: Build native loader with real Chisels+RGB light probes
        working-directory: port-work/mc1211-neoforge
        run: gradle --no-daemon build
      - name: Two REAL production clients with Complementary Reimagined ON, distinct screenshots of mixed RGB glass
        env:
          RGB_PORT_SHADER_ON: '1'
          RGB_PORT_STRICT_LIGHT_PROBE: '1'
          RGB_PORT_TEST_MIXED_CNB: '1'
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_two_clients.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-neoforge-complementary-ON-real-mixed-rgb-glass-light
          path: |
            mc1211-neoforge-two-clients/evidence/
            port-work/mc1211-neoforge/build/reports/
          retention-days: 30
