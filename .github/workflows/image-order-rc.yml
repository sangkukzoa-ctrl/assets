name: Image Order - v0.5.5 candidate artifacts (no publication)
on:
  push:
    branches: ['image-order/rc-v0.5.5']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned release and verify original-image source policy
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
          python3 image-order-studio/tests/release_source_checks.py
          python3 image-order-studio/tests/check-chrome-instrumentation.py --self-test
          bash -n image-order-studio/tests/sign-candidate.sh
          bash image-order-studio/tests/gradle-with-retry.sh candidate -p image-order-studio --no-daemon :app:assembleRelease
      - name: Verify existing signed beta identity and package unsigned candidate
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p candidate
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/published.apk" 'https://github.com/sangkukzoa-ctrl/assets/releases/download/image-order-beta/ImageOrderStudio.apk'
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/published.sha256" 'https://github.com/sangkukzoa-ctrl/assets/releases/download/image-order-beta/SHA256SUMS-LATEST.txt'
          expected="$(awk '$2=="ImageOrderStudio.apk" || $2=="*ImageOrderStudio.apk" {print $1}' "$RUNNER_TEMP/published.sha256")"
          [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/published.apk" | sha256sum -c -
          "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/published.apk" > candidate/published-signature.txt
          "$tools/aapt" dump badging "$RUNNER_TEMP/published.apk" | grep -F "package: name='com.twobornot.imageorder' versionCode='10' versionName='0.5.4'"
          grep -E '^Signer #1 certificate SHA-256 digest: [a-fA-F0-9]{64}$' candidate/published-signature.txt | awk '{print $NF}' > candidate/expected-signer-sha256.txt
          test "$(wc -l < candidate/expected-signer-sha256.txt)" -eq 1
          "$tools/zipalign" -p -f 4 image-order-studio/app/build/outputs/apk/release/app-release-unsigned.apk candidate/ImageOrder-v0.5.5-UNSIGNED.apk
          "$tools/zipalign" -c -p 4 candidate/ImageOrder-v0.5.5-UNSIGNED.apk
          "$tools/aapt" dump badging candidate/ImageOrder-v0.5.5-UNSIGNED.apk > candidate/candidate-badging.txt
          grep -F "package: name='com.twobornot.imageorder' versionCode='11' versionName='0.5.5'" candidate/candidate-badging.txt
          grep -F "sdkVersion:'26'" candidate/candidate-badging.txt
          "$tools/aapt" dump permissions candidate/ImageOrder-v0.5.5-UNSIGNED.apk > candidate/candidate-permissions.txt
          ! grep -E 'android.permission.INTERNET|BIND_ACCESSIBILITY_SERVICE' candidate/candidate-permissions.txt
          "$tools/aapt" dump xmltree candidate/ImageOrder-v0.5.5-UNSIGNED.apk AndroidManifest.xml > candidate/candidate-manifest.txt
          ! grep -E 'CrossAppMediaFixtureActivity|PickerHostActivity|ChromeUploadFixtureActivity|UploadAssistService|android.accessibilityservice' candidate/candidate-manifest.txt
          cp image-order-studio/tests/sign-candidate.sh candidate/
          cp image-order-studio/RC_VALIDATION_KO.md candidate/
          git rev-parse HEAD > candidate/source-commit.txt
          (cd candidate && sha256sum ImageOrder-v0.5.5-UNSIGNED.apk expected-signer-sha256.txt sign-candidate.sh > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ImageOrder-v0.5.5-UNSIGNED-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 14
