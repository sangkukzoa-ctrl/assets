name: RGB Blocks 1.3.1 BOTH native legacy ports complete release candidate bundle
on:
  workflow_dispatch:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/assemble_legacy_release_candidate.py'
      - '.github/workflows/rgb-blocks-legacy-two-native-release-candidates.yml'
      - 'rgb-blocks-compat/package_ecosystem.py'
      - 'rgb-blocks-compat/validate_full_parity.py'
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/lighting/RGBLightPersistence.java'
      - 'rgb-blocks-compat/build_mc1211_neoforge.py'
      - 'rgb-blocks-compat/build_mc1201_forge.py'
permissions:
  contents: read
jobs:
  neoforge1211:
    name: Build native NeoForge 1.21.1 RGB + full source + ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Preflight packaging and build scripts
        run: |
          python3 -m py_compile rgb-blocks-compat/assemble_legacy_release_candidate.py rgb-blocks-compat/package_ecosystem.py rgb-blocks-compat/build_mc1211_fabric.py rgb-blocks-compat/build_mc1211_neoforge.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate uninstrumented NATIVE 1.21.1 NeoForge source from original 1.3.1
        run: |
          set -euxo pipefail
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
      - name: Compile production JAR and standalone source Gradle wrapper
        working-directory: port-work/mc1211-neoforge
        run: |
          set -euxo pipefail
          gradle --no-daemon build
          gradle --no-daemon wrapper --gradle-version 8.10.2
      - name: Release-blocking original full 1.3.1 registry and pixel asset byte identity
        run: python3 rgb-blocks-compat/validate_full_parity.py neoforge1211
      - name: Actual NeoForge dedicated server / C&B 21.1.32 smoke
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_server.py
      - name: Build official-source SHA512-pinned C&B Sodium Iris Complementary launcher profile
        run: python3 rgb-blocks-compat/package_ecosystem.py neoforge1211
      - name: Stage checked exact-jar matching Modrinth pack and independent source ZIP
        run: python3 rgb-blocks-compat/assemble_legacy_release_candidate.py neoforge1211
      - uses: actions/upload-artifact@v4
        with:
          name: RGBBlocks-1.3.1-NeoForge-1.21.1-JAR-SOURCE-MRPACK
          path: release-stage/neoforge1211/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  forge1201:
    name: Build native Forge 1.20.1 RGB + full source + ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Preflight packaging and build scripts
        run: |
          python3 -m py_compile rgb-blocks-compat/assemble_legacy_release_candidate.py rgb-blocks-compat/package_ecosystem.py rgb-blocks-compat/build_mc1211_fabric.py rgb-blocks-compat/build_mc1201_forge.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate uninstrumented NATIVE 1.20.1 Forge source from original 1.3.1
        run: |
          set -euxo pipefail
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
      - name: Compile production JAR and standalone source Gradle wrapper
        working-directory: port-work/mc1201-forge
        run: |
          set -euxo pipefail
          gradle --no-daemon build
          gradle --no-daemon wrapper --gradle-version 8.8
      - name: Release-blocking original full 1.3.1 registry and pixel asset byte identity
        run: python3 rgb-blocks-compat/validate_full_parity.py forge1201
      - name: Actual Forge dedicated server / C&B 20.1.20 smoke
        run: python3 rgb-blocks-compat/test_mc1201_forge_server.py
      - name: Build official-source SHA512-pinned C&B Embeddium Oculus Complementary launcher profile
        run: python3 rgb-blocks-compat/package_ecosystem.py forge1201
      - name: Stage checked exact-jar matching Modrinth pack and independent source ZIP
        run: python3 rgb-blocks-compat/assemble_legacy_release_candidate.py forge1201
      - uses: actions/upload-artifact@v4
        with:
          name: RGBBlocks-1.3.1-Forge-1.20.1-JAR-SOURCE-MRPACK
          path: release-stage/forge1201/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  both-native-candidate-bundle:
    name: Bundle two fully validated, independent native versions
    runs-on: ubuntu-latest
    needs: [neoforge1211, forge1201]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RGBBlocks-1.3.1-NeoForge-1.21.1-JAR-SOURCE-MRPACK
          path: gather/neoforge1211
      - uses: actions/download-artifact@v4
        with:
          name: RGBBlocks-1.3.1-Forge-1.20.1-JAR-SOURCE-MRPACK
          path: gather/forge1201
      - name: Verify BOTH SHA256 manifests and create original 1.3.1 complete candidate ZIP
        run: python3 rgb-blocks-compat/assemble_legacy_release_candidate.py bundle gather/neoforge1211 gather/forge1201
      - uses: actions/upload-artifact@v4
        with:
          name: RGBBlocks-1.3.1-BOTH-NATIVE-LEGACY-PORTS-ALL-IN-ONE
          path: RGBBlocks-1.3.1-Legacy-Forge1201-NeoForge1211-TEST-CANDIDATES.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
