name: RGB Blocks 1.21.1 Fabric API migration compile
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/build_mc1211_fabric.py'
      - 'rgb-blocks-compat/test_mc1211_fabric_server.py'
      - '.github/workflows/rgb-blocks-port-mc1211.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Rebuild source layout and adapt MC1.21.1 APIs
        run: python3 rgb-blocks-compat/build_mc1211_fabric.py
      - name: Compile and build remapped mod jar
        working-directory: port-work/mc1211-fabric
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee compile.log
      - name: Package recovered and ported source (including unchanged assets)
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('port-work/mc1211-fabric')
          dst=Path('RgbBlocks-1.3.1-MC1.21.1-Fabric-port-source.zip')
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for base in ('src','build.gradle','settings.gradle','gradle.properties'):
              p=root/base
              files=p.rglob('*') if p.is_dir() else [p]
              for f in files:
                if f.is_file():z.write(f,str(f.relative_to(root)))
          print('Source ZIP:',dst.stat().st_size,'bytes')
          PY
      - name: Launch real Fabric dedicated server with C&B, test RGB commands and save/reload
        if: success()
        continue-on-error: true
        run: python3 rgb-blocks-compat/test_mc1211_fabric_server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-fabric-real-server-test-report
          path: |
            mc1211-fabric-runtime/*.log
            mc1211-fabric-runtime/result.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-fabric-build-logs
          path: port-work/mc1211-fabric/compile.log
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rgbblocks-1211-fabric-installable-jar-UNVERIFIED-RUNTIME
          path: port-work/mc1211-fabric/build/libs/*.jar
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rgbblocks-1211-fabric-full-source
          path: RgbBlocks-1.3.1-MC1.21.1-Fabric-port-source.zip
          retention-days: 30
