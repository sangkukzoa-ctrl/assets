name: RGB Blocks 1.21.1 Fabric API migration compile
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/build_mc1211_fabric.py'
      - '.github/workflows/rgb-blocks-port-mc1211.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Rebuild source layout and adapt MC1.21.1 APIs
        run: python3 rgb-blocks-compat/build_mc1211_fabric.py
      - name: Try full compilation and print failures
        working-directory: port-work/mc1211-fabric
        run: gradle --no-daemon --stacktrace compileJava 2>&1 | tee compile.log; test "\${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-fabric-compiler-output
          path: port-work/mc1211-fabric/compile.log
          retention-days: 14
