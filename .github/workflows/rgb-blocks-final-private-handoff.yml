name: RGB Blocks FINAL owner-only draft handoff and actual Windows server validation
on:
  workflow_dispatch:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - '.github/workflows/rgb-blocks-final-private-handoff.yml'
      - 'rgb-blocks-compat/transfer_private_handoff.py'
permissions:
  contents: write
jobs:
  neoforge1211:
    outputs:
      release_id: ${{ steps.handoff.outputs.release_id }}
      server_asset_id: ${{ steps.handoff.outputs.server_asset_id }}
      sums_asset_id: ${{ steps.handoff.outputs.sums_asset_id }}
    if: github.event_name == 'workflow_dispatch' || (vars.RGB_OWNER_SOURCE_READY == 'true' && vars.RGB_FULL_MATRIX == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rgb-package-ci]'))
    name: Build native NeoForge 1.21.1 RGB + full source + ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preflight packaging and build scripts
        run: |
          python3 -m py_compile rgb-blocks-compat/transfer_private_handoff.py rgb-blocks-compat/build_windows_ready_server.py rgb-blocks-compat/test_windows_ready_server.py rgb-blocks-compat/validate_full_parity.py rgb-blocks-compat/assemble_legacy_release_candidate.py rgb-blocks-compat/package_ecosystem.py rgb-blocks-compat/build_mc1211_fabric.py rgb-blocks-compat/build_mc1211_neoforge.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate uninstrumented NATIVE 1.21.1 NeoForge source from original 1.3.1
        run: |
          set -euxo pipefail
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1211_neoforge.py
      - name: Compile production JAR and standalone source Gradle wrapper
        working-directory: port-work/mc1211-neoforge
        run: |
          set -euxo pipefail
          gradle --no-daemon build
          gradle --no-daemon wrapper --gradle-version 8.10.2
      - name: Release-blocking original full 1.3.1 registry and pixel asset byte identity
        run: python3 rgb-blocks-compat/validate_full_parity.py neoforge1211
      - name: Actual NeoForge dedicated server / C&B 21.1.32 smoke
        run: python3 rgb-blocks-compat/test_mc1211_neoforge_server.py
      - name: Build official-source SHA512-pinned C&B Sodium Iris Complementary launcher profile
        run: python3 rgb-blocks-compat/package_ecosystem.py neoforge1211
      - name: Stage checked exact-jar matching Modrinth pack and independent source ZIP
        run: python3 rgb-blocks-compat/assemble_legacy_release_candidate.py neoforge1211
      - name: Build complete Windows server from SAME verified production candidate
        env:
          RGB_FINAL_HANDOFF: '1'
        run: |
          mkdir -p input/neoforge1211
          cp release-stage/neoforge1211/* input/neoforge1211/
          python3 rgb-blocks-compat/build_windows_ready_server.py neoforge1211
      - name: Store verified production candidate and Windows ZIP in an UNPUBLISHED owner draft
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 rgb-blocks-compat/transfer_private_handoff.py stage neoforge1211
      - uses: actions/upload-artifact@v4
        with:
          name: RGBBlocks-final-neoforge1211-hashes-and-parity-ONLY
          # Public repository: no source ZIP, JAR or MRPACK is uploaded.
          path: |
            release-stage/neoforge1211/SHA256SUMS.txt
            release-stage/neoforge1211/parity-neoforge1211.json
          if-no-files-found: error
          retention-days: 30
  forge1201:
    outputs:
      release_id: ${{ steps.handoff.outputs.release_id }}
      server_asset_id: ${{ steps.handoff.outputs.server_asset_id }}
      sums_asset_id: ${{ steps.handoff.outputs.sums_asset_id }}
    if: github.event_name == 'workflow_dispatch' || (vars.RGB_OWNER_SOURCE_READY == 'true' && vars.RGB_FULL_MATRIX == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rgb-package-ci]'))
    name: Build native Forge 1.20.1 RGB + full source + ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preflight packaging and build scripts
        run: |
          python3 -m py_compile rgb-blocks-compat/transfer_private_handoff.py rgb-blocks-compat/build_windows_ready_server.py rgb-blocks-compat/test_windows_ready_server.py rgb-blocks-compat/validate_full_parity.py rgb-blocks-compat/assemble_legacy_release_candidate.py rgb-blocks-compat/package_ecosystem.py rgb-blocks-compat/build_mc1211_fabric.py rgb-blocks-compat/build_mc1201_forge.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate uninstrumented NATIVE 1.20.1 Forge source from original 1.3.1
        run: |
          set -euxo pipefail
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
      - name: Compile production JAR and standalone source Gradle wrapper
        working-directory: port-work/mc1201-forge
        run: |
          set -euxo pipefail
          gradle --no-daemon build
          gradle --no-daemon wrapper --gradle-version 8.8
      - name: Release-blocking original full 1.3.1 registry and pixel asset byte identity
        run: python3 rgb-blocks-compat/validate_full_parity.py forge1201
      - name: Actual Forge dedicated server / C&B 20.1.20 smoke
        run: python3 rgb-blocks-compat/test_mc1201_forge_server.py
      - name: Build official-source SHA512-pinned C&B Embeddium Oculus Complementary launcher profile
        run: python3 rgb-blocks-compat/package_ecosystem.py forge1201
      - name: Stage checked exact-jar matching Modrinth pack and independent source ZIP
        run: python3 rgb-blocks-compat/assemble_legacy_release_candidate.py forge1201
      - name: Build complete Windows server from SAME verified production candidate
        env:
          RGB_FINAL_HANDOFF: '1'
        run: |
          mkdir -p input/forge1201
          cp release-stage/forge1201/* input/forge1201/
          python3 rgb-blocks-compat/build_windows_ready_server.py forge1201
      - name: Store verified production candidate and Windows ZIP in an UNPUBLISHED owner draft
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 rgb-blocks-compat/transfer_private_handoff.py stage forge1201
      - uses: actions/upload-artifact@v4
        with:
          name: RGBBlocks-final-forge1201-hashes-and-parity-ONLY
          # Public repository: no source ZIP, JAR or MRPACK is uploaded.
          path: |
            release-stage/forge1201/SHA256SUMS.txt
            release-stage/forge1201/parity-forge1201.json
          if-no-files-found: error
          retention-days: 30

  neoforge1211-windows:
    needs: neoforge1211
    env:
      RGB_HANDOFF_RELEASE_ID: ${{ needs.neoforge1211.outputs.release_id }}
      RGB_HANDOFF_SERVER_ASSET_ID: ${{ needs.neoforge1211.outputs.server_asset_id }}
      RGB_HANDOFF_SUMS_ASSET_ID: ${{ needs.neoforge1211.outputs.sums_asset_id }}
    if: github.event_name == 'workflow_dispatch' || (vars.RGB_OWNER_SOURCE_READY == 'true' && vars.RGB_FULL_MATRIX == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rgb-package-ci]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact same server ZIP from UNPUBLISHED draft and verify SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python rgb-blocks-compat/transfer_private_handoff.py download neoforge1211
      - name: Actually start bundled Windows Java and native server twice; prove persistent RGB
        env:
          RGB_FINAL_HANDOFF: '1'
        run: python rgb-blocks-compat/test_windows_ready_server.py neoforge1211
      - name: Attach Windows success evidence to unpublished draft ONLY after actual test passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python rgb-blocks-compat/transfer_private_handoff.py verified neoforge1211
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RGBBlocks-final-neoforge1211-windows-runtime-logs-ONLY
          path: |
            windows-smoke/neoforge1211/*log
            windows-smoke/neoforge1211/result.json
          if-no-files-found: warn
          retention-days: 30

  forge1201-windows:
    needs: forge1201
    env:
      RGB_HANDOFF_RELEASE_ID: ${{ needs.forge1201.outputs.release_id }}
      RGB_HANDOFF_SERVER_ASSET_ID: ${{ needs.forge1201.outputs.server_asset_id }}
      RGB_HANDOFF_SUMS_ASSET_ID: ${{ needs.forge1201.outputs.sums_asset_id }}
    if: github.event_name == 'workflow_dispatch' || (vars.RGB_OWNER_SOURCE_READY == 'true' && vars.RGB_FULL_MATRIX == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rgb-package-ci]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact same server ZIP from UNPUBLISHED draft and verify SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python rgb-blocks-compat/transfer_private_handoff.py download forge1201
      - name: Actually start bundled Windows Java and native server twice; prove persistent RGB
        env:
          RGB_FINAL_HANDOFF: '1'
        run: python rgb-blocks-compat/test_windows_ready_server.py forge1201
      - name: Attach Windows success evidence to unpublished draft ONLY after actual test passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python rgb-blocks-compat/transfer_private_handoff.py verified forge1201
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RGBBlocks-final-forge1201-windows-runtime-logs-ONLY
          path: |
            windows-smoke/forge1201/*log
            windows-smoke/forge1201/result.json
          if-no-files-found: warn
          retention-days: 30
