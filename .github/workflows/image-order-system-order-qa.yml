name: Image Order - system picker order contract A/B
on:
  push:
    branches: ['image-order/system-order-qa']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
          bash -n image-order-studio/tests/run-system-order-qa.sh
          bash image-order-studio/tests/gradle-with-retry.sh direct-prebuild -p image-order-studio --no-daemon :app:assembleDebug :externalcaller:assembleDebug :externalcaller:assembleDebugAndroidTest
          cd image-order-studio
          sha256sum app/build/outputs/apk/debug/app-debug.apk externalcaller/build/outputs/apk/debug/externalcaller-debug.apk externalcaller/build/outputs/apk/androidTest/debug/externalcaller-debug-androidTest.apk > direct-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: direct-picker-apks
          path: |
            image-order-studio/app/build/outputs/apk/debug/app-debug.apk
            image-order-studio/externalcaller/build/outputs/apk/debug/externalcaller-debug.apk
            image-order-studio/externalcaller/build/outputs/apk/androidTest/debug/externalcaller-debug-androidTest.apk
            image-order-studio/direct-apk-sha256.txt
          if-no-files-found: error
  direct:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [35, 36]
        ordered: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: direct-picker-apks
          path: image-order-studio
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ORDERED_PROBE: ${{ matrix.ordered }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 480
          emulator-options: '-no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect'
          script: bash image-order-studio/tests/run-direct-picker-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-order-api${{ matrix.api }}-ordered-${{ matrix.ordered }}
          path: image-order-studio/system-order-report/
          if-no-files-found: warn
          retention-days: 14
