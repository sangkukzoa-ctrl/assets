name: RGB Blocks 1.20.1 Forge real GUI client startup
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths: ['rgb-blocks-compat/test_mc1201_forge_client.py','.github/workflows/rgb-blocks-1201-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Install Linux GLX virtual display and software graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
          xvfb-run -a glxinfo -B | tail -n 12
      - name: Stage real RGB Blocks 1.20.1 Forge Gradle source
        run: |
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
          cd port-work/mc1201-forge
          gradle --no-daemon compileJava
      - name: Run Minecraft client with C&B and Embeddium isolated from Oculus dev-refmap
        run: python3 rgb-blocks-compat/test_mc1201_forge_client.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1201-forge-client-graphics-smoke-logs
          path: mc1201-forge-client-test/
          retention-days: 30
