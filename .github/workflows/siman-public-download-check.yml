name: Siman permanent beta public download verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Siman v1.5.5 Windows regression and beta release']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/siman-public-download-check.yml'
  schedule:
    - cron: '35 19 * * *' # 04:35 Asia/Seoul

permissions:
  contents: read

concurrency:
  group: siman-public-download-verification
  cancel-in-progress: true

jobs:
  public-download:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPOSITORY: sangkukzoa-ctrl/assets
      BETA_TAG: siman-beta
    steps:
      - name: Check public release and expected fixed asset names
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 40 \
            "https://api.github.com/repos/$REPOSITORY/releases/tags/$BETA_TAG" \
            -o release.json
          jq -e --arg tag "$BETA_TAG" \
            '(.tag_name == $tag) and (.draft == false) and (.prerelease == true)' release.json
          for name in SimanSetup.exe Siman-Windows.zip Siman_SOURCE.zip Siman_WEBSTORE.zip SHA256SUMS-LATEST.txt BETA_RELEASE_NOTES.md; do
            jq -e --arg name "$name" \
              '.assets | any(.[]; .name == $name and .state == "uploaded" and .size > 100)' release.json
          done

      - name: Verify anonymous downloads, archives and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$REPOSITORY/releases/download/$BETA_TAG"
          for name in SimanSetup.exe Siman-Windows.zip Siman_SOURCE.zip Siman_WEBSTORE.zip SHA256SUMS-LATEST.txt BETA_RELEASE_NOTES.md; do
            curl --fail --location --silent --show-error --retry 3 --max-time 90 "$base/$name" -o "$name"
            echo "Downloaded $name"
          done
          for name in SimanSetup.exe Siman-Windows.zip Siman_SOURCE.zip Siman_WEBSTORE.zip; do
            expected=$(tr -d '\r' < SHA256SUMS-LATEST.txt | awk -v f="$name" '$2==f {print $1}')
            actual=$(sha256sum "$name" | cut -d ' ' -f1)
            echo "SHA256 check $name: expected=[$expected] actual=[$actual]"
            test -n "$expected" && test "$actual" = "$expected" || { echo "::error::SHA256 manifest mismatch: $name"; cat SHA256SUMS-LATEST.txt; exit 1; }
            digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' release.json)
            if [ -n "$digest" ]; then
              test "$digest" = "sha256:$actual" || { echo "::error::GitHub digest mismatch: $name"; exit 1; }
            fi
          done
          unzip -tq Siman-Windows.zip
          unzip -tq Siman_SOURCE.zip
          unzip -tq Siman_WEBSTORE.zip
          unzip -Z1 Siman-Windows.zip | grep -Eq '^SimanSetup[.]exe$'
          unzip -Z1 Siman_SOURCE.zip | grep -Eq '^app/manifest[.]json$'
          unzip -Z1 Siman_WEBSTORE.zip | grep -Eq '(^|/)manifest[.]json$'
          echo 'All permanent beta public downloads and checksums validated'
          echo "### Fixed beta verified: https://github.com/$REPOSITORY/releases/tag/$BETA_TAG" >> "$GITHUB_STEP_SUMMARY"
