name: RGB Blocks 1.21.1 Fabric real GUI client startup
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths: ['rgb-blocks-compat/test_mc1211_fabric_client.py','.github/workflows/rgb-blocks-1211-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.12.1'}
      - name: Install real software OpenGL and virtual graphics display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
          xvfb-run -a glxinfo -B | tail -n 12
      - name: Generate RGB 1.21.1 source and compile
        run: |
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          cd port-work/mc1211-fabric
          gradle --no-daemon classes
      - name: Launch client with original RGB Blocks, C&B, Sodium and Iris
        continue-on-error: true
        run: python3 rgb-blocks-compat/test_mc1211_fabric_client.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-1211-fabric-client-graphics-smoke-logs
          path: mc1211-fabric-client-test/
          retention-days: 30
