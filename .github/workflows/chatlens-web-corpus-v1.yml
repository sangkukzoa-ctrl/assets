name: ChatLens OCR live public-domain web corpus v1
on:
  push:
    branches: [chatlens-web-corpus-v1]
    paths: ['ChatLensOCR/benchmarks/web_corpus_v1.py', '.github/workflows/chatlens-web-corpus-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: chatlens-web-corpus-v1
  cancel-in-progress: false
jobs:
  capture-and-audit:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and run synthetic capture selftest
        run: |
          python -m pip install playwright==1.51.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
          python ChatLensOCR/benchmarks/web_corpus_v1.py selftest
          if ($LASTEXITCODE -ne 0) { throw 'Selftest failed' }
      - name: Capture 30 unique live law documents, no synthetic substitution
        run: |
          python ChatLensOCR/benchmarks/web_corpus_v1.py capture corpus --seed 20261128
          if ($LASTEXITCODE -ne 0) { throw 'Live capture incomplete' }
      - name: Download exact RC4 QA artifact and validate build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45986164713 --repo $env:GITHUB_REPOSITORY --name ChatLensOCR-v050-rc4-Windows-QA --dir rc4
          if ($LASTEXITCODE -ne 0) { throw 'RC4 artifact download failed' }
          $manifest = Get-Content rc4/build-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne 'fc5680546af3d09d964c36816109daf110df4d62' -or $manifest.version -ne '0.5.0-rc.4' -or $manifest.released_publicly -ne $false) { throw 'RC4 provenance mismatch' }
          $zip = 'ChatLensOCR_v0.5.0-rc.4_Windows_x64.zip'
          $exe = 'ChatLensOCR_v0.5.0-rc.4.exe'
          $sums = @{}
          Get-Content rc4/SHA256SUMS.txt | ForEach-Object { if ($_ -match '^([a-fA-F0-9]{64})\s+(.+)$') { $sums[$Matches[2]]=$Matches[1].ToLowerInvariant() } }
          if ((Get-FileHash "rc4/$zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sums[$zip]) { throw 'ZIP checksum mismatch' }
          Expand-Archive "rc4/$zip" rc4/extracted
          if ((Get-FileHash "rc4/extracted/$exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sums[$exe]) { throw 'EXE checksum mismatch' }
          Copy-Item rc4/build-manifest.json corpus/rc4-build-manifest.json
          Copy-Item rc4/SHA256SUMS.txt corpus/rc4-SHA256SUMS.txt
      - name: Execute RC4 actual Windows OCR on live screenshots
        run: |
          $exe = (Resolve-Path 'rc4/extracted/ChatLensOCR_v0.5.0-rc.4.exe').Path
          $images = (Resolve-Path 'corpus/images').Path
          $audit = Join-Path $PWD 'rc4-audit.jsonl'
          $p = Start-Process -FilePath $exe -ArgumentList '--audit-folder', ('"'+$images+'"'), ('"'+$audit+'"') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OCR audit failed: $($p.ExitCode)" }
          python ChatLensOCR/benchmarks/web_corpus_v1.py score corpus rc4-audit.jsonl rc4-report.json --version 0.5.0-rc.4
          if ($LASTEXITCODE -ne 0) { throw 'OCR scoring failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatLensOCR-WebCorpus-v1-live-frozen
          path: corpus/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatLensOCR-WebCorpus-v1-RC4-results
          path: |
            rc4-report.json
            rc4-audit.jsonl
          if-no-files-found: warn
          retention-days: 90
