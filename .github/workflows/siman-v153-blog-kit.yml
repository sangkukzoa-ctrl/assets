name: Package Siman v1.5.3 beta for Naver Blog (plain text revision)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/siman-v153-blog-kit.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  blog-package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tested Siman v1.5.3 executable from original release
        run: |
          set -euo pipefail
          mkdir -p stage dist
          gh release download siman-v1.5.3 --pattern 'SimanSetup.exe' --dir stage
          echo '0a0738a58f05c8599dc04daae8fe0915c34902e012f13d84062f47e8c878e4e4  stage/SimanSetup.exe' | sha256sum -c -
      - name: Assemble Naver Blog attachment and publisher kit
        run: |
          set -euo pipefail
          cp siman/blog-v153/README_사용방법.txt stage/
          cp siman/blog-v153/CHANGELOG_알려진문제.txt stage/
          cp siman/blog-v153/PRIVACY_권한과저장방식.txt stage/
          (cd stage && zip -q -9 ../dist/Siman_v1.5.3_BLOG_ATTACHMENT.zip SimanSetup.exe 'README_사용방법.txt' 'CHANGELOG_알려진문제.txt' 'PRIVACY_권한과저장방식.txt')
          cp siman/blog-v153/BLOG_POST_복사용.txt dist/
          cp siman/blog-v153/BLOGGER_작업순서.txt dist/
          mkdir -p kit
          cp dist/Siman_v1.5.3_BLOG_ATTACHMENT.zip dist/BLOG_POST_복사용.txt dist/BLOGGER_작업순서.txt kit/
          (cd kit && zip -q -9 ../dist/Siman_v1.5.3_BLOGGER_KIT.zip *)
          unzip -t dist/Siman_v1.5.3_BLOG_ATTACHMENT.zip | tail -1
          unzip -t dist/Siman_v1.5.3_BLOGGER_KIT.zip | tail -1
          (cd dist && sha256sum *.zip > BLOG_SHA256SUMS.txt)
      - name: Publish blog files as assets under existing v1.5.3 beta release
        run: |
          set -euo pipefail
          gh release upload siman-v1.5.3 dist/Siman_v1.5.3_BLOG_ATTACHMENT.zip dist/Siman_v1.5.3_BLOGGER_KIT.zip dist/BLOG_POST_복사용.txt dist/BLOGGER_작업순서.txt dist/BLOG_SHA256SUMS.txt --clobber
          gh release view siman-v1.5.3 --json assets --jq '.assets[].name'
      - name: GitHub provenance attestation for blog archive (not Windows code signing)
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: 'dist/Siman_v1.5.3_BLOG_ATTACHMENT.zip'
