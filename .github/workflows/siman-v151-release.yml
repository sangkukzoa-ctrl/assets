name: Siman v1.5.1 bridge regression Windows and release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/siman-v151-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src dist
          base64 -d siman/release/v151/Siman_v1.5.1_SOURCE.zip.base64 > dist/Siman_v1.5.1_SOURCE.zip
          echo '531301f99282e41d142101b45e9b5590fdbb4d3f214b42e49e9b470ea87ed02a  dist/Siman_v1.5.1_SOURCE.zip' | sha256sum -c -
          unzip -q dist/Siman_v1.5.1_SOURCE.zip -d src
      - name: Validate bridge, collectors and manifest
        shell: bash
        run: |
          node src/tests/collectors.test.cjs
          node src/tests/bridge.test.cjs
          for f in src/app/*.js; do node --check "$f"; done
          node -e "const m=require('./src/app/manifest.json');if(m.version!=='1.5.1'||m.manifest_version!==3)process.exit(1)"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Windows CMD installer fresh install and upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:SIMAN_CI_TEST='1'
          $folder=Join-Path $env:RUNNER_TEMP 'SimanV151'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $zip=Join-Path $folder 'install.zip'
          $encoded=Get-Content 'siman/release/v151/Siman_v1.5.1_INSTALL.zip.base64' -Raw
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($encoded.Trim()))
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if($sha -ne '790359b514d615c72fc2d6f1656caeffe6bfde437278bdd089e5dcce5ebb2fde'){throw "Bad hash $sha"}
          $dir=Join-Path $folder 'unpacked'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $cmd=Join-Path $dir 'INSTALL.cmd'
          $cmdbytes=[IO.File]::ReadAllBytes($cmd)
          if([Text.Encoding]::ASCII.GetString($cmdbytes) -match '(?<!\r)\n'){throw 'CMD LF line endings'}
          $proc=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',('"' + $cmd + '"')) -Wait -PassThru -NoNewWindow
          if($proc.ExitCode -ne 0){throw "Fresh installation failed $($proc.ExitCode)"}
          $installed=Join-Path $env:LOCALAPPDATA '2bornot\Siman\app\manifest.json'
          if((Get-Content $installed -Raw | ConvertFrom-Json).version -ne '1.5.1'){throw 'New install version mismatch'}
          $old=Get-Content $installed -Raw | ConvertFrom-Json
          $old.version='1.5.0'
          $old | ConvertTo-Json -Depth 20 | Set-Content -Path $installed -Encoding utf8
          $proc=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',('"' + $cmd + '"')) -Wait -PassThru -NoNewWindow
          if($proc.ExitCode -ne 0){throw "Upgrade failed $($proc.ExitCode)"}
          if((Get-Content $installed -Raw | ConvertFrom-Json).version -ne '1.5.1'){throw 'Upgrade version mismatch'}
          Write-Host 'PASS Siman v1.5.1 Windows fresh + upgrade'
  release:
    needs: [regression,windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in siman/release/v151/Siman_v1.5.1_*.zip.base64; do base64 -d "$p" > "dist/$(basename "$p" .base64)"; done
          echo '790359b514d615c72fc2d6f1656caeffe6bfde437278bdd089e5dcce5ebb2fde  dist/Siman_v1.5.1_INSTALL.zip' | sha256sum -c -
          echo '531301f99282e41d142101b45e9b5590fdbb4d3f214b42e49e9b470ea87ed02a  dist/Siman_v1.5.1_SOURCE.zip' | sha256sum -c -
          echo 'ba7fdfa1999d723e14e31c5022c288d13435170bc0c671407dbd7a987a05a3f8  dist/Siman_v1.5.1_WEBSTORE.zip' | sha256sum -c -
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=siman-v1.5.1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.zip dist/SHA256SUMS.txt --title "심안 心眼 v1.5.1 (Preview)" --notes-file siman/RELEASE_NOTES_v1.5.1.md --prerelease --latest=false
          else
            gh release upload "$tag" dist/*.zip dist/SHA256SUMS.txt --clobber
          fi
      - name: Signed artifact provenance if service available
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*.zip'
