name: RGB Blocks Forge 1.20.1 REAL Nether vs Overworld RGB+C&B isolation
on:
  push:
    branches: [rgb-blocks-legacy-compat-audit]
    paths:
      - 'rgb-blocks-compat/recovered/fabric/com/rgbblocks/client/lighting/RGBLightPersistence.java'
      - 'rgb-blocks-compat/recovered/neoforge/com/rgbblocks/client/lighting/RGBLightPersistence.java'
      - 'rgb-blocks-compat/inject_ci_dimension_probe.py'
      - 'rgb-blocks-compat/inject_ci_two_client_sync_probe.py'
      - 'rgb-blocks-compat/test_mc1201_forge_two_clients.py'
      - '.github/workflows/rgb-blocks-1201-forge-two-dimensions.yml'
  workflow_dispatch:
permissions:
  # Required to read the verified private draft owner-source archive.
  contents: write
jobs:
  live-two-dimensions:
    if: github.event_name == 'workflow_dispatch' || (vars.RGB_OWNER_SOURCE_READY == 'true' && vars.RGB_FULL_MATRIX == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rgb-final-ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify CI-only and game test source syntax
        run: |
          python3 -m py_compile rgb-blocks-compat/inject_ci_dimension_probe.py rgb-blocks-compat/inject_ci_mixed_cnb_probe.py rgb-blocks-compat/inject_ci_only_light_probe.py rgb-blocks-compat/inject_ci_two_client_sync_probe.py rgb-blocks-compat/test_mc1201_forge_two_clients.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Install real graphical client environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot mesa-utils libgl1-mesa-dri libgl1 libasound2t64 libxrandr2 libxcursor1 libxinerama1 libxi6
      - name: Generate genuine target loader source and CI-only Nether probe
        run: |
          set -euxo pipefail
          RGB_OWNER_SOURCE_RELEASE_TAG=rgbblocks-131-private-original-source GITHUB_TOKEN="${{ github.token }}" python3 rgb-blocks-compat/stage_owner_original.py
          python3 rgb-blocks-compat/verify_owner_runtime_migration.py
          python3 rgb-blocks-compat/build_mc1211_fabric.py
          python3 rgb-blocks-compat/build_mc1201_forge.py
          python3 rgb-blocks-compat/inject_ci_only_light_probe.py forge1201
          python3 rgb-blocks-compat/inject_ci_two_client_sync_probe.py
          python3 rgb-blocks-compat/inject_ci_mixed_cnb_probe.py forge1201
          python3 rgb-blocks-compat/inject_ci_dimension_probe.py forge1201
      - name: Compile full palette + true mixed C&B game artifacts
        working-directory: port-work/mc1201-forge
        run: gradle --no-daemon build
      - name: TWO real clients test Nether BLUE, Overworld GREEN and mixed C&B, independent dimensional snapshots
        env:
          RGB_PORT_TEST_MIXED_CNB: '1'
          RGB_PORT_TEST_DIMENSIONS: '1'
        run: python3 rgb-blocks-compat/test_mc1201_forge_two_clients.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgbblocks-forge-1201-real-nether-overworld-mixed-cnb-rgb-evidence
          path: |
            mc1201-forge-two-clients/evidence/
            port-work/mc1201-forge/build/reports/
          retention-days: 30
